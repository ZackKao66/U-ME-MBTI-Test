<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>U&ME MBTI</title>
  <style>
    :root{
      --bg:#f7f4ee; --surface:#fcfbf8; --surface-2:#f2ede5; --border:rgba(40,37,29,.12);
      --text:#1f1c16; --muted:#6f6a61; --accent:#c7a56a; --accent-2:#8d9fb5; --shadow:0 20px 60px rgba(42,33,18,.10);
      --radius:24px; --r2:18px; --r3:14px; --max:1080px;
      --font-display:'Georgia',serif; --font-body:'Inter',system-ui,sans-serif;
    }
    [data-theme="dark"]{--bg:#151412;--surface:#1d1c19;--surface-2:#23211d;--border:rgba(255,255,255,.10);--text:#f1ece3;--muted:#aaa49a;--accent:#d4b67a;--accent-2:#9fb0c4;--shadow:0 24px 70px rgba(0,0,0,.35)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%} body{font-family:var(--font-body);background:radial-gradient(circle at top, rgba(199,165,106,.16), transparent 38%), var(--bg); color:var(--text); overflow:hidden}
    .wrap{min-height:100vh;display:block;padding:0}
    .stage{width:100vw;height:100dvh;background:linear-gradient(180deg, color-mix(in oklab, var(--surface) 88%, white), var(--surface));border:0;border-radius:0;box-shadow:none;position:relative;overflow:hidden}
    .topbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;z-index:3}
    .brandmark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted)}
    .logo{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--accent)}
    .toggle,.start{border:1px solid var(--border);background:color-mix(in oklab, var(--surface) 76%, white);color:var(--text);border-radius:999px;padding:12px 16px;font:inherit}
    .hero{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center}
    .brand{display:grid;gap:18px;justify-items:center;transform:translateY(10px);animation:floatIn 1.8s cubic-bezier(.16,1,.3,1) .2s both;width:min(92vw,760px)}
    .logo-image{width:min(62vw,480px);aspect-ratio:3/1;display:grid;place-items:center;border-radius:28px;border:1px solid color-mix(in oklab, var(--accent) 30%, var(--border));background:linear-gradient(135deg, color-mix(in oklab, var(--surface) 72%, white), color-mix(in oklab, var(--surface-2) 82%, var(--accent) 6%));box-shadow:0 18px 48px rgba(0,0,0,.08);transform:translateY(10px) scale(.96);animation:floatIn 1.8s cubic-bezier(.16,1,.3,1) .2s both}
    .logo-image span{font-family:var(--font-display);font-size:clamp(44px,7vw,84px);line-height:1;letter-spacing:.08em;color:var(--text)}
    .sub{max-width:40ch;color:var(--muted);font-size:clamp(16px,1.8vw,18px);line-height:1.7;margin-top:2px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .start{width:64px;height:64px;padding:0;background:transparent;border:0;color:transparent;box-shadow:none}
    .hint{display:none}
    .ripple{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle, rgba(255,255,255,.38) 0%, rgba(255,255,255,.18) 25%, rgba(255,255,255,0) 70%);animation:rip .75s ease-out forwards;mix-blend-mode:screen}
    .glow{position:absolute;inset:auto; width:420px;height:420px;filter:blur(70px);opacity:.55;background:radial-gradient(circle, color-mix(in oklab, var(--accent) 28%, transparent), transparent 62%);left:50%;top:42%;transform:translate(-50%,-50%);animation:pulse 5s ease-in-out infinite}
    @keyframes floatIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes rip{from{width:0;height:0;opacity:.85}to{width:360px;height:360px;opacity:0}}
    @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.7}}
    @media (max-width:720px){body{overflow:hidden}.stage{width:100vw;height:100dvh}.hero{padding:20px}.topbar{padding:16px}.sub{font-size:16px}.logo-image{width:min(86vw,420px)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="stage" id="stage" aria-label="U&ME 心理測驗開場">
      <div class="topbar">
        <div class="brandmark"><span class="logo">U</span><span>U&ME MBTI</span></div>
        <button class="toggle" id="themeBtn" type="button">切換模式</button>
      </div>
      <div class="glow" aria-hidden="true"></div>
      <div class="hero">
        <div class="brand">
          <div class="logo-image" aria-label="U&ME LOGO">
            <span>U&ME</span>
          </div>
          <div class="sub">你的內心世界旅程即將開始。</div>
          <div class="actions">
            <button class="start" id="startBtn" type="button" aria-label="開始測驗"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const stage = document.getElementById('stage');
    const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
    let theme = prefersDark ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    themeBtn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
    });
    stage.addEventListener('pointerdown', (e) => {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = stage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      r.style.left = x + 'px';
      r.style.top = y + 'px';
      stage.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    });
    document.getElementById('startBtn').addEventListener('click', () => alert('下一步我們再接題目頁。'));
  </script>
</body>
</html>
