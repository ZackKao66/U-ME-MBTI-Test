<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>U&ME MBTI</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#f7f4ee;--surface:#fcfbf8;--surface-2:#f2ede5;
      --border:rgba(40,37,29,.12);--text:#1f1c16;--muted:#6f6a61;
      --accent:#c7a56a;--accent-2:#8d9fb5;--bar-bg:rgba(40,37,29,.08);
      --font-display:'Georgia',serif;--font-body:'Inter',system-ui,sans-serif;
      --theme-glow:rgba(199,165,106,.22);
      --theme-grad-a:#c7a56a;--theme-grad-b:#8d9fb5;
    }
    [data-theme="dark"]{
      --bg:#151412;--surface:#1d1c19;--surface-2:#23211d;
      --border:rgba(255,255,255,.10);--text:#f1ece3;--muted:#aaa49a;
      --accent:#d4b67a;--accent-2:#9fb0c4;--bar-bg:rgba(255,255,255,.08);
    }
    [data-result-theme="E"]{
      --accent:#8d9fb5;--accent-2:#c7a56a;
      --theme-glow:rgba(141,159,181,.22);
      --theme-grad-a:#8d9fb5;--theme-grad-b:#c7a56a;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%}
    body{font-family:var(--font-body);background:radial-gradient(circle at top,rgba(199,165,106,.16),transparent 38%),var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .stage{width:100vw;height:100svh;min-height:100svh;position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in oklab,var(--surface) 88%,white),var(--surface));isolation:isolate}
    .topbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;z-index:8}
    .brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--muted)}
    .logo{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--accent)}
    .toggle{min-height:40px;padding:8px 12px;border:1px solid var(--border);background:color-mix(in oklab,var(--surface) 76%,white);color:var(--text);border-radius:999px;cursor:pointer}
    .screen{position:absolute;inset:0;display:grid;place-items:center;padding:calc(70px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));text-align:center;transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1),filter .45s cubic-bezier(.16,1,.3,1);overflow:hidden}
    .screen[hidden]{opacity:0;pointer-events:none;transform:translateY(10px) scale(.982);filter:blur(8px)}
    .screen.active{opacity:1;transform:translateY(0);filter:none}
    .glow{position:absolute;width:min(78vw,700px);height:min(78vw,700px);filter:blur(90px);opacity:.42;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 22%,transparent),transparent 64%);left:50%;top:50%;transform:translate(-50%,-50%);animation:pulse 5s ease-in-out infinite;pointer-events:none;z-index:0;transition:background .6s ease}
    .brand-wave{position:absolute;inset:auto 0 0 0;height:42vh;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--accent) 6%,transparent) 30%,transparent 100%);opacity:.6;pointer-events:none;z-index:0;animation:wave 12s ease-in-out infinite}
    .brand{display:grid;gap:16px;justify-items:center;width:min(92vw,760px);animation:floatIn 1.1s cubic-bezier(.16,1,.3,1) both;position:relative;z-index:1}
    .logo-image{width:min(82vw,460px);aspect-ratio:3/1;display:grid;place-items:center;border-radius:24px;border:1px solid color-mix(in oklab,var(--accent) 30%,var(--border));background:linear-gradient(135deg,color-mix(in oklab,var(--surface) 72%,white),color-mix(in oklab,var(--surface-2) 82%,var(--accent) 6%));box-shadow:0 18px 48px rgba(0,0,0,.08);backdrop-filter:blur(10px);animation:logoFloat 6s ease-in-out infinite}
    .logo-image span{font-family:var(--font-display);font-size:clamp(40px,10vw,84px);line-height:1;letter-spacing:.08em}
    .sub{max-width:28ch;color:var(--muted);font-size:clamp(14px,3.8vw,18px);line-height:1.7}
    .count-badge{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:6px 14px;border-radius:999px;background:color-mix(in oklab,var(--surface-2) 80%,white);letter-spacing:.06em}
    .start{width:84px;height:84px;border-radius:50%;border:1px solid color-mix(in oklab,var(--accent) 45%,var(--border));background:color-mix(in oklab,var(--accent) 84%,white);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 30px rgba(184,155,98,.22);font-weight:700;letter-spacing:.08em;transition:transform .2s ease,box-shadow .2s ease}
    .start:hover{transform:scale(1.06);box-shadow:0 18px 40px rgba(184,155,98,.32)}
    .start::before{content:"開始";font-size:14px}

    .quiz{width:min(100%,760px);display:grid;gap:12px;justify-items:stretch;text-align:left;position:relative;z-index:2}
    .quiz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
    .quiz-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .quiz-title{margin:0;font-family:var(--font-display);font-size:clamp(24px,6vw,44px);line-height:1.1}
    .quiz-progress{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
    .progress-bar{height:8px;border-radius:999px;background:var(--bar-bg);overflow:hidden;border:1px solid var(--border)}
    .progress-bar>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 88%,white),color-mix(in oklab,var(--accent-2) 78%,white));transition:width .4s cubic-bezier(.16,1,.3,1)}
    .progress-bar.complete>span{animation:barComplete .6s ease forwards}
    @keyframes barComplete{0%{filter:brightness(1)}40%{filter:brightness(1.6) saturate(1.5)}100%{filter:brightness(1)}}

    .card{border:1px solid var(--border);background:color-mix(in oklab,var(--surface) 84%,white);border-radius:22px;padding:16px;box-shadow:0 18px 46px rgba(0,0,0,.06);backdrop-filter:blur(10px);will-change:transform,opacity}
    .card.exit-left{animation:exitLeft .2s cubic-bezier(.4,0,1,1) both}
    .card.enter-right{animation:enterRight .26s cubic-bezier(0,0,.2,1) both}
    .card.exit-right{animation:exitRight .2s cubic-bezier(.4,0,1,1) both}
    .card.enter-left{animation:enterLeft .26s cubic-bezier(0,0,.2,1) both}
    @keyframes exitLeft{to{transform:translateX(-36px);opacity:0;filter:blur(2px)}}
    @keyframes enterRight{from{transform:translateX(36px);opacity:0;filter:blur(2px)}to{transform:translateX(0);opacity:1;filter:none}}
    @keyframes exitRight{to{transform:translateX(36px);opacity:0;filter:blur(2px)}}
    @keyframes enterLeft{from{transform:translateX(-36px);opacity:0;filter:blur(2px)}to{transform:translateX(0);opacity:1;filter:none}}

    .question{margin:0 0 14px;font-size:clamp(18px,5vw,28px);line-height:1.35;font-weight:700}
    .options{display:grid;gap:10px}
    .option{
      width:100%;min-height:52px;text-align:left;padding:14px;
      border-radius:16px;border:1px solid var(--border);
      background:var(--surface-2);color:var(--text);cursor:pointer;
      line-height:1.45;font-size:15px;white-space:pre-line;
      position:relative;overflow:hidden;
      transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .14s ease;
    }
    .option:hover{border-color:color-mix(in oklab,var(--accent) 42%,var(--border));background:color-mix(in oklab,var(--surface-2) 84%,var(--accent) 6%);box-shadow:0 8px 18px rgba(0,0,0,.04)}
    .option:active{transform:scale(.985)}
    .option.selected{
      border-color:color-mix(in oklab,var(--accent) 68%,var(--border));
      background:color-mix(in oklab,var(--surface-2) 72%,var(--accent) 14%);
      box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--accent) 22%,transparent),0 6px 16px rgba(0,0,0,.04);
      transform:none;
    }
    .option.selected::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 28% 50%,color-mix(in oklab,var(--accent) 20%,transparent),transparent 68%);pointer-events:none;animation:optionGlow .38s ease forwards}
    @keyframes optionGlow{from{opacity:0}to{opacity:1}}
    .option.selected::before{content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--accent);font-weight:700;opacity:0;animation:checkIn .25s cubic-bezier(.16,1,.3,1) .06s forwards}
    @keyframes checkIn{from{opacity:0;transform:translateY(-50%) scale(.6)}to{opacity:1;transform:translateY(-50%) scale(1)}}

    .nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .ghost,.next,.share-btn,.restart-btn{min-height:46px;padding:11px 16px;border-radius:999px;cursor:pointer;transition:transform .18s ease,opacity .18s ease,background .18s ease,border-color .18s ease;font:inherit}
    .ghost{border:1px solid var(--border);background:transparent;color:var(--text)}
    .next,.restart-btn{border:1px solid transparent;background:var(--accent);color:#fff;min-width:110px}
    .ghost:hover,.next:hover,.restart-btn:hover,.share-btn:hover{transform:translateY(-1px)}
    .next:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .footer-note{font-size:11px;color:var(--muted);text-align:center}

    .result-screen-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--theme-glow),transparent 40%),radial-gradient(circle at 20% 80%,color-mix(in oklab,var(--accent-2) 8%,transparent),transparent 38%);opacity:.95;pointer-events:none;animation:drift 18s ease-in-out infinite;transition:background .8s ease}
    .cinema-wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),transparent 18%,transparent 82%,rgba(0,0,0,.04));pointer-events:none;z-index:0}
    .reveal-burst{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,color-mix(in oklab,var(--accent) 28%,transparent),transparent 55%);opacity:0;pointer-events:none;z-index:1}
    .reveal-burst.fire{animation:burst .9s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes burst{0%{opacity:.9;transform:scale(.7)}60%{opacity:.5}100%{opacity:0;transform:scale(1.4)}}

    .result-layout{width:min(100%,920px);height:100%;display:grid;align-items:center}
    .result-card{max-width:100%;height:min(100%,calc(100svh - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));display:grid;grid-template-rows:auto auto auto auto;gap:10px;text-align:left;border-radius:28px;padding:16px;background:linear-gradient(180deg,color-mix(in oklab,var(--surface) 68%,white),color-mix(in oklab,var(--surface-2) 92%,var(--accent) 5%));position:relative;overflow:hidden;border:1px solid color-mix(in oklab,var(--accent) 18%,var(--border));box-shadow:0 24px 60px rgba(0,0,0,.08);transform-origin:center bottom;animation:resultRise 900ms cubic-bezier(.16,1,.3,1) both}
    .result-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left,color-mix(in oklab,var(--accent) 14%,transparent),transparent 42%),radial-gradient(circle at bottom right,color-mix(in oklab,var(--accent-2) 10%,transparent),transparent 44%),repeating-linear-gradient(135deg,transparent 0 22px,color-mix(in oklab,var(--text) 2%,transparent) 22px 23px);opacity:.9;pointer-events:none}
    .result-hero,.result-section,.share-row,.result-cta{position:relative;z-index:1}
    .result-hero{display:grid;gap:8px}
    .result-meta{display:flex;gap:8px;flex-wrap:wrap}
    .result-badge,.pill{padding:7px 10px;border-radius:999px;border:1px solid var(--border);background:color-mix(in oklab,var(--surface-2) 88%,white);font-size:11px;letter-spacing:.06em}
    .result-section{display:grid;gap:6px;padding-top:10px;border-top:1px solid color-mix(in oklab,var(--border) 80%,transparent)}
    .result-section h2{margin:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .result-section p,.result-desc{margin:0;color:var(--muted);line-height:1.55;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .result-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}

    .result-code{font-family:var(--font-display);font-size:clamp(34px,11vw,72px);line-height:1;margin-bottom:2px;letter-spacing:.12em;display:flex;gap:.06em}
    .slot-char{display:inline-block;position:relative;overflow:hidden;height:1.1em;width:.72em;vertical-align:top}
    .slot-inner{display:flex;flex-direction:column;transition:none}
    .slot-inner span{display:block;height:1.1em;line-height:1.1;text-align:center}
    .result-name{font-size:clamp(22px,6vw,34px);font-weight:700;margin-bottom:2px;font-family:var(--font-display);line-height:1.05;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
    .result-name.show{opacity:1;transform:translateY(0)}
    .result-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .4s ease .1s}
    .result-tag.show{opacity:1}

    .share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
    .share-btn{border:1px solid var(--border);background:color-mix(in oklab,var(--surface) 78%,white);color:var(--text);min-height:48px;padding:12px 16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.02em}
    .share-btn svg{flex-shrink:0}
    .share-btn.primary{background:linear-gradient(135deg,var(--theme-grad-a),var(--theme-grad-b));border-color:transparent;color:#fff;box-shadow:0 8px 20px var(--theme-glow)}
    .platform-icons{grid-column:1/-1;display:flex;justify-content:center;gap:14px;padding:4px 0 0}
    .platform-icons span{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:color-mix(in oklab,var(--surface-2) 88%,white);display:grid;place-items:center;font-size:14px}
    .share-hint{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);line-height:1.5;padding:2px 0 0}
    .result-cta{margin-top:0}
    .restart-btn{width:100%;min-height:42px}
    .share-btn.loading{opacity:.7;pointer-events:none}
    .share-btn.loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-left:6px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .share-shot{
      position:fixed;left:0;top:0;
      transform:translateX(9999px);
      width:1080px;aspect-ratio:4/5;padding:64px;
      color:#1f1c16;pointer-events:none;
    }
    .share-shot-card{position:relative;overflow:hidden;border-radius:42px;padding:56px;height:100%;border:1px solid rgba(40,37,29,.12);box-shadow:0 30px 90px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .share-shot-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left,rgba(199,165,106,.18),transparent 42%),radial-gradient(circle at bottom right,rgba(141,159,181,.12),transparent 44%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(31,28,22,.025) 22px 23px);pointer-events:none}
    .share-shot-card.theme-m{background:linear-gradient(160deg,#fdf9f2,#f5ede0)}
    .share-shot-card.theme-e{background:linear-gradient(160deg,#f2f5f9,#e4ecf4)}
    .share-brand,.share-code,.share-name,.share-tag,.share-copy,.share-pills{position:relative;z-index:1}
    .share-brand{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:#6f6a61;margin-bottom:30px}
    .share-code{font-family:Georgia,serif;font-size:112px;line-height:1;margin-bottom:18px}
    .share-name{font-family:Georgia,serif;font-size:58px;line-height:1.05;margin-bottom:12px}
    .share-tag{font-size:22px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
    .share-copy{font-size:28px;line-height:1.75;color:#6f6a61;max-width:24ch}
    .share-pills{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 0}
    .share-pill{padding:12px 18px;border-radius:999px;border:1px solid rgba(40,37,29,.12);background:rgba(255,255,255,.7);font-size:18px}
    .share-footer{position:relative;z-index:1;margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
    .share-footer-text{font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#6f6a61}
    .share-qr-hint{font-size:15px;color:#aaa49a;letter-spacing:.06em}

    @keyframes floatIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.68}}
    @keyframes wave{50%{transform:translateY(-10px);opacity:.8}}
    @keyframes logoFloat{50%{transform:translateY(-4px)}}
    @keyframes drift{50%{transform:translateY(-6px) scale(1.01)}}
    @keyframes resultRise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes rip{from{width:0;height:0;opacity:.85}to{width:360px;height:360px;opacity:0}}

    @media(max-width:767px){
      .nav{flex-direction:column}.ghost,.next{width:100%}
      .screen{padding:calc(66px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
      .quiz{gap:10px}
      .result-layout{height:auto}
      .result-card{height:min(100%,calc(100svh - 88px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));padding:14px;border-radius:24px;gap:8px;transform:scale(.98)}
      .share-row{grid-template-columns:1fr 1fr}
      .result-section p,.result-desc{-webkit-line-clamp:2}
    }
    @media(min-width:768px){
      .topbar{padding:calc(16px + env(safe-area-inset-top)) 24px 16px}
      .screen{padding:calc(82px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
      .logo-image{width:min(56vw,520px)}
      .quiz{width:min(90vw,860px);gap:16px}
      .card{padding:22px;border-radius:28px}
      .option{min-height:58px;padding:16px}
      .result-card{padding:22px;height:min(100%,calc(100svh - 108px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
      .result-code{font-size:clamp(48px,10vw,88px)}
      .result-name{font-size:clamp(28px,5vw,42px)}
      .result-section p,.result-desc{font-size:14px;-webkit-line-clamp:3}
    }
    @media(min-width:1024px){
      .screen{padding:calc(96px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom))}
      .quiz{width:min(82vw,920px)}
      .logo-image{width:min(48vw,540px)}
      .sub{max-width:40ch}
      .result-card{max-width:920px;height:min(100%,calc(100svh - 122px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));grid-template-columns:1.15fr .85fr;grid-template-rows:auto auto auto;column-gap:20px}
      .result-hero{grid-column:1}
      .result-section:first-of-type{grid-column:1}
      .result-section:last-of-type{grid-column:2;grid-row:1/span 2;border-top:none;padding-top:0;padding-left:8px}
      .share-row{grid-column:1}
      .result-cta{grid-column:2;align-self:end}
    }
    @media(hover:none){.option:hover,.ghost:hover,.next:hover,.restart-btn:hover,.share-btn:hover{transform:none;box-shadow:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="stage" id="stage">
  <div class="topbar">
    <div class="brandmark"><span class="logo">U</span><span>U&ME MBTI</span></div>
    <button class="toggle" id="themeBtn" type="button">切換模式</button>
  </div>
  <div class="glow" aria-hidden="true"></div>
  <div class="brand-wave" aria-hidden="true"></div>

  <section class="screen active" id="introScreen">
    <div class="brand">
      <div class="logo-image" aria-label="U&ME LOGO"><span>U&ME</span></div>
      <div class="sub">你的內心世界旅程即將開始。</div>
      <div class="count-badge">✦ 已有 2,847 人完成測驗</div>
      <button class="start" id="startBtn" type="button" aria-label="開始測驗"></button>
    </div>
  </section>

  <section class="screen" id="quizScreen" hidden>
    <div class="quiz">
      <div class="quiz-head">
        <div>
          <div class="quiz-kicker">U&ME MBTI TEST</div>
          <h1 class="quiz-title" id="quizTitle">第 1 題</h1>
        </div>
        <div class="quiz-progress" id="quizProgress">1 / 12</div>
      </div>
      <div class="progress-bar" id="progressBar"><span id="progressFill"></span></div>
      <div class="card" id="quizCard">
        <p class="question" id="questionText"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="nav">
        <button class="ghost" id="backBtn" type="button">上一題</button>
        <button class="next" id="nextBtn" type="button" disabled>下一題</button>
      </div>
      <div class="footer-note">選完自動前進，最後一題需點「完成」。</div>
    </div>
  </section>

  <section class="screen" id="resultScreen" hidden>

const state={
  index:0,
  answers:Array(questions.length).fill(null),
  score:{Mood:0,Energy:0,Intimacy:0,Direct:0,Romance:0,Touch:0,Curious:0,Lust:0},
  sliding:false
};

const setScreen=s=>{
  [introScreen,quizScreen,resultScreen].forEach(el=>{el.hidden=el!==s;el.classList.remove('active')});
  s.hidden=false;
  requestAnimationFrame(()=>s.classList.add('active'));
};

const updateProgress=()=>{
  const pct=Math.max(0,Math.min(100,(state.index/(questions.length-1))*100));
  progressFill.style.width=`${pct}%`;
  if(pct>=100){
    progressBar.classList.add('complete');
    setTimeout(()=>progressBar.classList.remove('complete'),700);
  }
};

function slideCard(direction,cb){
  if(state.sliding)return;
  state.sliding=true;
  const exitClass=direction==='forward'?'exit-left':'exit-right';
  const enterClass=direction==='forward'?'enter-right':'enter-left';
  quizCard.classList.add(exitClass);
  quizCard.addEventListener('animationend',function onExit(){
    quizCard.removeEventListener('animationend',onExit);
    quizCard.classList.remove(exitClass);
    cb();
    void quizCard.offsetWidth;
    quizCard.classList.add(enterClass);
    quizCard.addEventListener('animationend',function onEnter(){
      quizCard.removeEventListener('animationend',onEnter);
      quizCard.classList.remove(enterClass);
      state.sliding=false;
    });
  });
}

const renderQuestion=()=>{
  const i=state.index;
  quizTitle.textContent=`第 ${i+1} 題`;
  quizProgress.textContent=`${i+1} / ${questions.length}`;
  questionText.textContent=questions[i].q;
  optionsEl.innerHTML='';
  updateProgress();
  questions[i].a.forEach((txt,idx)=>{
    const key=['A','B','C','D'][idx];
    const b=document.createElement('button');
    b.className='option';b.type='button';b.textContent=txt;
    if(state.answers[i]===key)b.classList.add('selected');
    b.addEventListener('click',()=>{
      if(state.sliding)return;
      state.answers[i]=key;
      renderQuestion();
      if(i<questions.length-1){
        setTimeout(()=>goNext('forward'),300);
      }else{
        nextBtn.disabled=false;
        nextBtn.textContent='完成';
      }
    });
    optionsEl.appendChild(b);
  });
  backBtn.disabled=i===0;
  nextBtn.textContent=i===questions.length-1?'完成':'下一題';
  nextBtn.disabled=state.answers[i]==null;
};

function goNext(dir='forward'){
  if(state.answers[state.index]==null||state.sliding)return;
  if(state.index<questions.length-1){
    slideCard(dir,()=>{state.index+=1;renderQuestion();});
  }else{showResult();}
}
function goPrev(){
  if(state.index>0&&!state.sliding){
    slideCard('back',()=>{state.index-=1;renderQuestion();});
  }
}
const startQuiz=()=>{
  state.index=0;state.sliding=false;
  state.answers=Array(questions.length).fill(null);
  progressFill.style.width='0%';
  setScreen(quizScreen);renderQuestion();
};

const computeResult=()=>{
  state.score={Mood:0,Energy:0,Intimacy:0,Direct:0,Romance:0,Touch:0,Curious:0,Lust:0};
  state.answers.forEach((ans,i)=>{
    if(!ans)return;
    const[k,v]=scoreMap[i][ans];state.score[k]+=v;
  });
  return[
    state.score.Mood>=state.score.Energy    ?'M':'E',
    state.score.Intimacy>=state.score.Direct?'I':'D',
    state.score.Romance>=state.score.Touch  ?'R':'T',
    state.score.Curious>=state.score.Lust   ?'C':'L'
  ].join('');
};

// ── Slot Machine ──────────────────────────────────────────────────────
const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const slotStyle=document.createElement('style');
slotStyle.textContent=`@keyframes slotLock{0%{transform:translateY(0)}30%{transform:translateY(-4px)}65%{transform:translateY(2px)}100%{transform:translateY(0)}}`;
document.head.appendChild(slotStyle);

function runSlotMachine(targetCode){
  resultCodeEl.innerHTML='';
  const chars=[...targetCode];
  const slots=chars.map(()=>{
    const wrap=document.createElement('span');wrap.className='slot-char';
    const inner=document.createElement('div');inner.className='slot-inner';
    for(let i=0;i<18;i++){
      const s=document.createElement('span');
      s.textContent=CHARS[Math.floor(Math.random()*CHARS.length)];
      inner.appendChild(s);
    }
    const target=document.createElement('span');target.textContent='?';
    inner.appendChild(target);
    wrap.appendChild(inner);
    resultCodeEl.appendChild(wrap);
    return{wrap,inner,target};
  });
  chars.forEach((ch,ci)=>{
    const{inner,target,wrap}=slots[ci];
    const delay=ci*320+200;
    const duration=520+ci*80;
    setTimeout(()=>{
      inner.style.transition=`transform ${duration}ms cubic-bezier(.22,.68,0,1.2)`;
      inner.style.transform=`translateY(-${(inner.children.length-1)*1.1}em)`;
    },delay);
    setTimeout(()=>{
      target.textContent=ch;
      inner.style.transition='none';
      wrap.style.animation='slotLock .32s cubic-bezier(.36,.07,.19,.97)';
      setTimeout(()=>wrap.style.animation='',380);
    },delay+duration+40);
  });
  const totalDelay=chars.length*320+200+700;
  setTimeout(()=>{
    resultName.classList.add('show');
    resultTag.classList.add('show');
  },totalDelay);
}

const showResult=()=>{
  const code=computeResult();
  const r=results[code]||results.MIRC;
  const isE=code.startsWith('E');
  root.setAttribute('data-result-theme',isE?'E':'M');
  shareCard.className=`share-shot-card theme-${isE?'e':'m'}`;
  revealBurst.classList.remove('fire');
  void revealBurst.offsetWidth;
  revealBurst.classList.add('fire');
  resultName.textContent=r.name;resultName.classList.remove('show');
  resultTag.textContent=r.tag;resultTag.classList.remove('show');
  resultDesc.textContent=r.desc;
  resultCategory.textContent=code.startsWith('M')
    ?'妳屬於先感受、再進入的類型。妳需要氛圍、信任與細節慢慢堆疊，才會真正打開。'
    :'妳屬於先被帶動、再投入的類型。妳喜歡明確節奏、立即回饋與更直接的互動。';
  resultMood.textContent=code[2]==='R'?'情感導向':'感官導向';
  resultPace.textContent=code.startsWith('M')?'節奏：氛圍':'節奏：直接';
  resultDrive.textContent=code[3]==='C'?'步調：探索':'步調：熱烈';
  resultPills.innerHTML='';
  r.pills.forEach(t=>{const s=document.createElement('span');s.className='pill';s.textContent=t;resultPills.appendChild(s);});
  shareCode.textContent=code;
  shareName.textContent=r.name;
  shareTag.textContent=r.tag;
  shareTag.style.color=isE?'#8d9fb5':'#c7a56a';
  shareDesc.textContent=r.desc;
  sharePills.innerHTML='';
  r.pills.forEach(t=>{const el=document.createElement('span');el.className='share-pill';el.textContent=t;sharePills.appendChild(el);});
  setScreen(resultScreen);
  setTimeout(()=>runSlotMachine(code),480);
};

const restartToStart=()=>{
  root.removeAttribute('data-result-theme');
  state.index=0;state.sliding=false;
  state.answers=Array(questions.length).fill(null);
  progressFill.style.width='0%';nextBtn.disabled=true;
  setScreen(introScreen);
};

// ── 截圖：translateX(9999px) 永遠推到視窗外，不需要任何顯示切換 ──
async function makeShareBlob(){
  const canvas=await html2canvas(shareShot,{
    backgroundColor:null,
    scale:2,
    useCORS:true,
    allowTaint:true,
    x:0,y:0,
    scrollX:-9999,
    scrollY:0,
    width:1080,
    height:shareShot.offsetHeight
  });
  return new Promise(resolve=>canvas.toBlob(blob=>resolve(blob),'image/png',1));
}
async function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
async function handleShare(){
  const code=shareCode.textContent;
  shareBtn.classList.add('loading');shareBtn.querySelector('svg').style.display='none';
  try{
    const blob=await makeShareBlob();
    const file=new File([blob],`ume-mbti-${code}.png`,{type:'image/png',lastModified:Date.now()});
    const data={
      files:[file],
      title:'U&ME MBTI 結果',
      text:`我在 U&ME MBTI 測到 ${code}｜${shareName.textContent}｜${shareTag.textContent}\n\n測測你是哪種類型 👇`
    };
    if(navigator.canShare&&navigator.canShare(data))await navigator.share(data);
    else{await downloadBlob(blob,`ume-mbti-${code}.png`);alert('已下載圖片，請手動上傳到你想分享的平台 🙌');}
  }catch(e){if(e.name!=='AbortError')console.warn(e);}
  finally{shareBtn.classList.remove('loading');shareBtn.querySelector('svg').style.display='';}
}
async function handleSave(){
  const code=shareCode.textContent;
  const orig=saveBtn.innerHTML;
  saveBtn.classList.add('loading');saveBtn.querySelector('svg').style.display='none';
  try{
    const blob=await makeShareBlob();
    await downloadBlob(blob,`ume-mbti-${code}.png`);
    saveBtn.classList.remove('loading');saveBtn.querySelector('svg').style.display='';
    saveBtn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已儲存';
    setTimeout(()=>saveBtn.innerHTML=orig,1800);
  }catch(e){saveBtn.classList.remove('loading');saveBtn.innerHTML=orig;}
}

root.setAttribute('data-theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
themeBtn.addEventListener('click',()=>root.setAttribute('data-theme',root.getAttribute('data-theme')==='dark'?'light':'dark'));

stage.addEventListener('pointerdown',e=>{
  const r=document.createElement('span');
  r.style.cssText='position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.38) 0%,rgba(255,255,255,.18) 25%,rgba(255,255,255,0) 70%);animation:rip .75s ease-out forwards;mix-blend-mode:screen;z-index:4';
  const rect=stage.getBoundingClientRect();
  r.style.left=(e.clientX-rect.left)+'px';r.style.top=(e.clientY-rect.top)+'px';
  stage.appendChild(r);r.addEventListener('animationend',()=>r.remove());
});

startBtn.addEventListener('click',startQuiz);
nextBtn.addEventListener('click',()=>goNext('forward'));
backBtn.addEventListener('click',goPrev);
restartBtn.addEventListener('click',restartToStart);
shareBtn.addEventListener('click',handleShare);
saveBtn.addEventListener('click',handleSave);
</script>
