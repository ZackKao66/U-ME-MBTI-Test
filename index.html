<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>U&ME MBTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0c1730;--surface:#111f3a;--surface-2:#1a2d4a;
      --border:rgba(152,170,184,.18);--text:#d7dbe2;--muted:#98aab8;
      --accent:#98aab8;--accent-2:#566573;--bar-bg:rgba(152,170,184,.12);
      --font-display:'Noto Serif TC','Georgia',serif;--font-body:'Noto Sans TC',system-ui,sans-serif;
      --theme-glow:rgba(33,57,90,.55);--theme-grad-a:#21395a;--theme-grad-b:#98aab8;
      --topbar-h:62px;
    }
    [data-result-theme="E"]{--accent:#d7dbe2;--accent-2:#98aab8;--theme-glow:rgba(86,101,115,.42);--theme-grad-a:#566573;--theme-grad-b:#d7dbe2;}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;}
    button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
    .curtain{position:fixed;inset:0;z-index:999;pointer-events:none;display:grid;place-items:center;background:var(--bg);animation:curtainFade 2.2s cubic-bezier(.16,1,.3,1) forwards}
    .curtain-logo{opacity:0;animation:curtainLogoIn 1s cubic-bezier(.16,1,.3,1) .2s forwards,curtainLogoOut .55s cubic-bezier(.4,0,1,1) 1.25s forwards}
    .curtain-logo img{filter:brightness(0) saturate(100%) invert(88%) sepia(8%) saturate(200%) hue-rotate(185deg) brightness(110%)}
    @keyframes curtainFade{0%{opacity:1}58%{opacity:1}100%{opacity:0;pointer-events:none}}
    @keyframes curtainLogoIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
    @keyframes curtainLogoOut{from{opacity:1}to{opacity:0;transform:scale(1.08)}}
    .stage{width:100vw;height:100svh;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(33,57,90,.55),transparent),radial-gradient(ellipse 60% 40% at 80% 110%,rgba(12,23,48,.8),transparent),var(--bg);}
    .stars{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .star{position:absolute;border-radius:50%;background:#d7dbe2;animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s)}
    @keyframes twinkle{0%,100%{opacity:.05}50%{opacity:var(--peak,.25)}}
    .glow-a{position:absolute;width:min(90vw,780px);height:min(90vw,780px);filter:blur(110px);opacity:.48;background:radial-gradient(circle,rgba(33,57,90,.7),rgba(12,23,48,.1) 65%);left:50%;top:40%;transform:translate(-50%,-50%);animation:pulseA 6s ease-in-out infinite;pointer-events:none;z-index:0}
    .glow-b{position:absolute;width:min(50vw,420px);height:min(50vw,420px);filter:blur(80px);opacity:.32;background:radial-gradient(circle,rgba(86,101,115,.5),transparent 65%);left:15%;top:65%;transform:translate(-50%,-50%);animation:pulseB 9s ease-in-out infinite;pointer-events:none;z-index:0}
    @keyframes pulseA{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.48}50%{transform:translate(-50%,-52%) scale(1.08);opacity:.62}}
    @keyframes pulseB{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.32}50%{transform:translate(-48%,-52%) scale(1.12);opacity:.44}}
    .topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;height:calc(var(--topbar-h) + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 16px 12px;z-index:8;opacity:0;animation:fadeSlideDown .7s cubic-bezier(.16,1,.3,1) 2s forwards}
    @keyframes fadeSlideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    .brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
    .logo-mark{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--accent);background:rgba(33,57,90,.3);backdrop-filter:blur(8px)}
    .progress-label{font-size:10px;letter-spacing:.14em;color:var(--accent);text-align:center;height:16px;overflow:hidden;position:relative}
    .progress-label span{display:block;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .35s ease}
    .progress-label span.out{transform:translateY(-100%);opacity:0}
    .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:calc(var(--topbar-h) + env(safe-area-inset-top) + 8px);padding-bottom:calc(12px + env(safe-area-inset-bottom));padding-left:clamp(10px,3vw,24px);padding-right:clamp(10px,3vw,24px);text-align:center;transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1),filter .5s cubic-bezier(.16,1,.3,1);overflow:hidden}
    .screen[hidden]{opacity:0;pointer-events:none;transform:translateY(12px) scale(.98);filter:blur(10px)}
    .screen.active{opacity:1;transform:none;filter:none}
    #introScreen{overflow-y:auto;}
    #quizScreen,#resultScreen{align-items:flex-start;overflow-y:auto;}
    .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,24px);width:min(92vw,480px);max-height:100%;position:relative;z-index:1;padding:4px 0;margin:auto}
    .brand-top{display:grid;gap:clamp(4px,1.2vh,10px);justify-items:center;animation:staggerA 1s cubic-bezier(.16,1,.3,1) 2.1s both}
    .brand-mid{display:grid;gap:clamp(4px,1vh,8px);justify-items:center;animation:staggerB 1s cubic-bezier(.16,1,.3,1) 2.28s both}
    .brand-bot{display:grid;justify-items:center;animation:staggerC 1s cubic-bezier(.16,1,.3,1) 2.46s both}
    @keyframes staggerA{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes staggerB{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes staggerC{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    .logo-wrap{position:relative;display:grid;place-items:center}
    .logo-aura{position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(33,57,90,.45),transparent 68%);animation:auraPulse 3.5s ease-in-out infinite;filter:blur(18px)}
    @keyframes auraPulse{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.12);opacity:.85}}
    .logo-image{width:clamp(90px,min(36vw,30vh),200px);position:relative;z-index:1;animation:logoFloat 5s ease-in-out infinite}
    .logo-image img{width:100%;height:auto;display:block;filter:brightness(0) saturate(100%) invert(88%) sepia(8%) saturate(200%) hue-rotate(185deg) brightness(110%) drop-shadow(0 2px 20px rgba(152,170,184,.4));}
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .brand-divider{width:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(152,170,184,.45),transparent)}
    .brand-tagline{font-size:clamp(11px,2vw,14px);color:var(--muted);letter-spacing:.08em;line-height:1.6;margin:0}
    .count-badge{font-size:clamp(10px,1.8vw,11px);color:var(--muted);border:1px solid var(--border);padding:5px 13px;border-radius:999px;background:rgba(33,57,90,.32);letter-spacing:.06em;backdrop-filter:blur(10px)}
    .start-wrap{display:grid;gap:clamp(5px,1vh,9px);justify-items:center;margin-top:clamp(2px,.8vh,8px)}
    .start{width:clamp(52px,7vmin,68px);height:clamp(52px,7vmin,68px);border-radius:50%;border:1px solid rgba(152,170,184,.28);background:linear-gradient(145deg,#21395a,#566573);color:#d7dbe2;display:grid;place-items:center;box-shadow:0 8px 28px rgba(12,23,48,.5),0 0 0 6px rgba(33,57,90,.18),inset 0 1px 0 rgba(215,219,226,.12);transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s ease;}
    .start:hover{transform:scale(1.08)}
    .start:active{transform:scale(.95)}
    .start-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .resume-banner{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid rgba(152,170,184,.2);background:rgba(33,57,90,.45);backdrop-filter:blur(10px);font-size:12px;color:var(--muted);width:100%;}
    .resume-banner.show{display:flex}
    .resume-banner b{color:var(--text)}
    .resume-actions{display:flex;gap:8px}
    .resume-btn{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(33,57,90,.3);color:var(--text);font-size:11px;cursor:pointer}
    .resume-btn.primary{background:linear-gradient(135deg,#21395a,#566573);border-color:rgba(152,170,184,.18);color:#d7dbe2}
    .quiz{width:100%;max-width:860px;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);text-align:left;position:relative;z-index:2;margin:0 auto;padding-bottom:8px;}
    .quiz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
    .quiz-kicker{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .quiz-title{margin:0;font-family:var(--font-display);font-size:clamp(20px,4.5vw,36px);line-height:1.1;color:var(--text)}
    .quiz-progress{font-size:11px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
    .progress-bar{height:4px;border-radius:999px;background:var(--bar-bg);overflow:hidden}
    .progress-bar>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#21395a,#98aab8,#d7dbe2);background-size:200% 100%;transition:width .45s cubic-bezier(.16,1,.3,1);animation:shimmer 3s linear infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .reveal-hint{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--accent);opacity:0;transform:translateY(5px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
    .reveal-hint.show{opacity:1;transform:none}
    .reveal-hint::before{content:'✦ ';font-size:9px}
    .card{border:1px solid var(--border);background:color-mix(in oklab,#111f3a 92%,rgba(33,57,90,.5));border-radius:clamp(16px,2.5vw,24px);padding:clamp(13px,2vw,22px);box-shadow:0 20px 52px rgba(12,23,48,.45),inset 0 1px 0 rgba(215,219,226,.1);backdrop-filter:blur(14px);}
    .card.exit-left{animation:exitLeft .22s cubic-bezier(.4,0,1,1) both}
    .card.enter-right{animation:enterRight .3s cubic-bezier(0,0,.2,1) both}
    .card.exit-right{animation:exitRight .22s cubic-bezier(.4,0,1,1) both}
    .card.enter-left{animation:enterLeft .3s cubic-bezier(0,0,.2,1) both}
    @keyframes exitLeft{to{transform:translateX(-44px) scale(.97);opacity:0;filter:blur(4px)}}
    @keyframes enterRight{from{transform:translateX(44px) scale(.97);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
    @keyframes exitRight{to{transform:translateX(44px) scale(.97);opacity:0;filter:blur(4px)}}
    @keyframes enterLeft{from{transform:translateX(-44px) scale(.97);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
    .question{margin:0 0 clamp(9px,1.4vh,14px);font-size:clamp(15px,3.5vw,22px);line-height:1.45;font-weight:700;color:var(--text)}
    .q-char{display:inline;opacity:0;animation:charIn .35s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--cd,0s)}
    @keyframes charIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .options{display:grid;gap:clamp(6px,1vh,9px)}
    .option{width:100%;min-height:clamp(42px,6vh,54px);text-align:left;padding:clamp(10px,1.4vh,14px) clamp(34px,5vw,42px) clamp(10px,1.4vh,14px) clamp(11px,1.8vw,16px);border-radius:clamp(11px,1.8vw,14px);border:1px solid var(--border);background:rgba(33,57,90,.2);color:var(--text);line-height:1.45;font-size:clamp(13px,2.2vw,15px);position:relative;overflow:hidden;transition:background .18s,border-color .18s,transform .14s,box-shadow .18s;opacity:0;animation:optIn .38s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--od,0s)}
    @keyframes optIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
    .option::after{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:999px;background:var(--accent);opacity:0;transform:scaleY(.4);transition:opacity .2s,transform .2s;}
    .option:hover{border-color:rgba(152,170,184,.3);background:rgba(33,57,90,.38);box-shadow:0 4px 14px rgba(12,23,48,.28)}
    .option:active{transform:scale(.984)}
    .option.selected{border-color:rgba(152,170,184,.48);background:rgba(33,57,90,.55);box-shadow:inset 0 0 0 1px rgba(152,170,184,.12),0 6px 18px rgba(12,23,48,.3)}
    .option.selected::after{opacity:1;transform:scaleY(1)}
    .option.selected .opt-check{opacity:1;transform:translateY(-50%) scale(1)}
    .opt-check{position:absolute;right:clamp(10px,1.8vw,14px);top:50%;transform:translateY(-50%) scale(.5);width:20px;height:20px;border-radius:50%;background:rgba(152,170,184,.18);border:1px solid rgba(152,170,184,.32);display:grid;place-items:center;font-size:11px;color:var(--accent);font-weight:700;opacity:0;transition:opacity .22s,transform .22s cubic-bezier(.16,1,.3,1);}
    .option.tap-bounce{animation:tapBounce .22s both}
    @keyframes tapBounce{0%{transform:scale(1)}40%{transform:scale(.972)}100%{transform:scale(1)}}
    .nav{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
    .ghost,.next{min-height:clamp(40px,5.5vh,46px);padding:10px 18px;border-radius:999px;transition:transform .18s,opacity .18s,box-shadow .18s;font:inherit;font-size:clamp(13px,2vw,14px)}
    .ghost{border:1px solid var(--border);background:rgba(33,57,90,.22);color:var(--text)}
    .ghost:hover{transform:translateY(-1px)}
    .next{border:1px solid rgba(152,170,184,.18);background:linear-gradient(135deg,#21395a,#566573);color:#d7dbe2;min-width:100px;box-shadow:0 4px 18px rgba(12,23,48,.4)}
    .next:hover{transform:translateY(-2px)}
    .next:active,.next:disabled{transform:none}
    .next:disabled,.ghost:disabled{opacity:.35;cursor:not-allowed}
    .footer-note{font-size:clamp(10px,1.6vw,11px);color:var(--muted);text-align:center;opacity:.7}
    .result-code{font-family:var(--font-display);font-size:clamp(32px,9vw,72px);line-height:1;margin-bottom:2px;letter-spacing:.1em;display:flex;gap:.05em;color:#d7dbe2;}
    .result-code.revealed{background:linear-gradient(135deg,#d7dbe2 0%,#98aab8 45%,#566573 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .result-code.revealed span{display:inline;}
    .slot-char{display:inline-block;overflow:hidden;height:1.1em;width:.72em;vertical-align:top}
    .slot-inner{display:flex;flex-direction:column}
    .slot-inner span{display:block;height:1.1em;line-height:1.1;text-align:center}
    .result-name{font-size:clamp(20px,5vw,34px);font-weight:700;margin-bottom:1px;font-family:var(--font-display);line-height:1.05;color:#d7dbe2;opacity:0;filter:blur(14px);transform:translateY(12px) scale(.96);transition:opacity .7s ease,filter .7s ease,transform .7s cubic-bezier(.16,1,.3,1);}
    .result-name.show{opacity:1;filter:blur(0);transform:none}
    .result-name.revealed{background:linear-gradient(120deg,#d7dbe2 0%,#98aab8 60%,#566573 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .result-tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .5s ease .2s}
    .result-tag.show{opacity:1}
    .result-screen-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 20%,var(--theme-glow),transparent 55%);pointer-events:none;animation:drift 20s ease-in-out infinite}
    .cinema-wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,23,48,.08),transparent 15%,transparent 85%,rgba(12,23,48,.1));pointer-events:none;z-index:0}
    .reveal-burst{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(33,57,90,.65),transparent 55%);opacity:0;pointer-events:none;z-index:1}
    .reveal-burst.fire{animation:burst .95s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes burst{0%{opacity:.9;transform:scale(.65)}65%{opacity:.4}100%{opacity:0;transform:scale(1.5)}}
    .particles{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
    .particle{position:absolute;border-radius:50%;opacity:0}
    @keyframes particleFly{0%{opacity:.9;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
    .result-layout{width:min(100%,940px);margin:0 auto;position:relative;z-index:3;padding-bottom:8px;}
.result-card{
  width:100%;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:auto auto auto auto;
  gap:clamp(12px,1.8vh,18px);
  text-align:left;
  border-radius:clamp(18px,3vw,28px);
  padding:clamp(14px,2.2vw,22px);
  background:linear-gradient(160deg,#111f3a,#0f1b34);
  position:relative;
  border:1px solid rgba(152,170,184,.15);
  box-shadow:0 28px 72px rgba(12,23,48,.65),inset 0 1px 0 rgba(215,219,226,.08);
  animation:resultRise 950ms cubic-bezier(.16,1,.3,1) both;
}
#resultCharacterHost{
  grid-column:2;
  grid-row:1 / span 6;
  align-self:stretch;
  width:100%;
  min-height:clamp(168px,42vw,220px);
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(152,170,184,.14);
  background:linear-gradient(180deg,rgba(33,57,90,.22),rgba(17,31,58,.06));
  box-shadow:inset 0 1px 0 rgba(215,219,226,.05);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:1;
  pointer-events:none;
}

#resultCharacterHost img{
  width:112%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center bottom;
  transform:translateX(4%) scale(1.08);
}
    .result-card::after{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(152,170,184,.38),rgba(215,219,226,.22),rgba(152,170,184,.38),transparent);pointer-events:none;z-index:2}
    .result-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at top left,rgba(33,57,90,.32),transparent 40%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(215,219,226,.022) 22px 23px);pointer-events:none;z-index:0}
    .result-hero,.result-section,.share-row,.result-cta{position:relative;z-index:1;grid-column:1}
    .result-hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(118px,38vw,168px);
  align-items:start;
  column-gap:14px;
  row-gap:6px;
  min-height:clamp(168px,42vw,220px);
  opacity:0;
  transform:translateY(14px);
  animation:sectionIn .7s cubic-bezier(.16,1,.3,1) .3s forwards;
  }
  .result-hero > :not(#resultCharacterHost){
  grid-column:1;
  }
    .result-section{display:grid;gap:5px;padding-top:clamp(7px,1vh,10px);border-top:1px solid rgba(152,170,184,.09);opacity:0;transform:translateY(12px)}
    .result-section.s1{animation:sectionIn .65s cubic-bezier(.16,1,.3,1) .55s forwards}
    .result-section.s2{animation:sectionIn .65s cubic-bezier(.16,1,.3,1) .72s forwards}
    .share-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:2px;
  opacity:0;
  transform:translateY(10px);
  animation:sectionIn .6s cubic-bezier(.16,1,.3,1) .9s forwards;
  }
    .result-cta{padding-bottom:2px;opacity:0;transform:translateY(8px);animation:sectionIn .55s cubic-bezier(.16,1,.3,1) 1.05s forwards}
    @keyframes sectionIn{to{opacity:1;transform:none}}
    .result-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
    .result-badge,.pill{padding:4px 10px;border-radius:999px;border:1px solid rgba(152,170,184,.18);background:rgba(33,57,90,.38);font-size:clamp(10px,1.6vw,11px);letter-spacing:.06em;color:var(--muted)}
    .result-section h2{margin:0;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;opacity:.8}
    .result-section p,.result-desc{margin:0;color:var(--muted);line-height:1.58;font-size:clamp(12px,1.8vw,13px)}
    .result-pill-row{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0}
    .score-bars{display:grid;gap:5px;margin:4px 0 0}
    .score-bar-row{display:grid;grid-template-columns:48px 1fr 30px;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
    .score-bar-track{height:3px;border-radius:999px;background:var(--bar-bg);overflow:hidden}

@media (max-width: 899px) {
  /* 1. 將結果卡片改為垂直堆疊 */
  .result-card {
    display: flex;

    justify-content: center;
    align-items: flex-end;
  }

    height: 100%;

    object-fit: contain;
    transform: scale(1.1); /* 稍微放大角色 */
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
  }

  /* 3. 調整標題區塊，解決文字擠壓問題 */
  .result-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 8px;
    min-height: auto;
  }

  .result-meta {
    justify-content: center; /* 標籤置中 */
    gap: 8px;

  }

  /* 5. 修復按鈕擠壓：重點是禁止文字換行並平分寬度 */
  .share-row {

    grid-template-columns: 1fr 1fr; /* 平分左右 */

    width: 100%;

  .share-btn {

    flex-direction: column;
    gap: 12px;
  }
  .ghost, .next {
    width: 100%;
    height: 46px;
  }

/* ── LocalStorage (with in-memory fallback) ── */
const LS_KEY='ume_mbti_progress';
let _memStore=null;
function saveProgress(){
  const data={index:state.index,answers:state.answers,ts:Date.now()};
  try{localStorage.setItem(LS_KEY,JSON.stringify(data));}
  catch(e){_memStore=data;}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return (_memStore&&(Date.now()-_memStore.ts<86400000))?_memStore:null;
    const d=JSON.parse(raw);
    if(Date.now()-d.ts>86400000){localStorage.removeItem(LS_KEY);return null;}
    return d;
  }catch(e){return (_memStore&&(Date.now()-_memStore.ts<86400000))?_memStore:null;}
}
function clearProgress(){
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  _memStore=null;
}

/* ── 進度條 ── */
function progressLabelText(i,total){
  if(i===0)return'開始囉 ✦';
  if(i===total-1)return'最後一題 ✦';
  if(i>=Math.floor(total*.6))return'快到了 ✦';
  if(i>=Math.floor(total*.3))return'繼續深入 ✦';
  return'';
}
const updateProgress=()=>{
  const pct=Math.max(0,Math.min(100,(state.index/(questions.length-1))*100));
  progressFill.style.width=`${pct}%`;
  const txt=progressLabelText(state.index,questions.length);
  const cur=progressLabel.querySelector('span');
  if(txt&&cur.textContent!==txt){cur.classList.add('out');setTimeout(()=>{cur.textContent=txt;cur.classList.remove('out');},220);}
  else if(!txt){cur.textContent='';}
};

/* ── 卡片動畫 ── */
function slideCard(dir,cb){
  if(state.sliding)return;
  state.sliding=true;
  const ec=dir==='forward'?'exit-left':'exit-right';
  const nc=dir==='forward'?'enter-right':'enter-left';
  quizCard.classList.add(ec);
  quizCard.addEventListener('animationend',function onE(){
    quizCard.removeEventListener('animationend',onE);
    quizCard.classList.remove(ec);cb();
    void quizCard.offsetWidth;
    quizCard.classList.add(nc);
    quizCard.addEventListener('animationend',function onN(){
      quizCard.removeEventListener('animationend',onN);
      quizCard.classList.remove(nc);state.sliding=false;
    });
  });
}

/* ── 題目渲染 ── */
function animateQuestion(text){
  questionText.innerHTML='';
  [...text].forEach((ch,i)=>{
    const s=document.createElement('span');s.className='q-char';s.textContent=ch;
    s.style.setProperty('--cd',`${Math.min(i*0.018,0.5)}s`);
    questionText.appendChild(s);
  });
}
const renderQuestion=()=>{
  const i=state.index;
  quizTitle.textContent=`第 ${i+1} 題`;
  quizProgress.textContent=`${i+1} / ${questions.length}`;
  animateQuestion(questions[i].q);
  optionsEl.innerHTML='';
  updateProgress();
  quizScreen.scrollTop=0;
  const isLast=i===questions.length-1;
  revealHint.classList.toggle('show',isLast&&state.answers[i]!==null);
  questions[i].a.forEach((txt,idx)=>{
    const key=['A','B','C','D'][idx];
    const b=document.createElement('button');b.className='option';b.type='button';
    b.style.setProperty('--od',`${0.12+idx*0.07}s`);
    b.innerHTML=`${txt}<span class="opt-check">✓</span>`;
    if(state.answers[i]===key)b.classList.add('selected');
    b.addEventListener('click',()=>{
      if(state.sliding)return;
      haptic(8);
      b.classList.add('tap-bounce');
      b.addEventListener('animationend',()=>b.classList.remove('tap-bounce'),{once:true});
      optionsEl.style.pointerEvents='none';
      setTimeout(()=>optionsEl.style.pointerEvents='',320);
      state.answers[i]=key;
      saveProgress();
      renderQuestion();
      if(i<questions.length-1)setTimeout(()=>goNext('forward'),300);
      else{nextBtn.disabled=false;nextBtn.textContent='完成';revealHint.classList.add('show');}
    });
    optionsEl.appendChild(b);
  });
  backBtn.disabled=i===0;
  nextBtn.textContent=isLast?'完成':'下一題';
  nextBtn.disabled=state.answers[i]==null;
};

/* ── 前進 / 後退 ── */
function goNext(dir='forward'){
  if(state.answers[state.index]==null||state.sliding)return;
  if(state.index<questions.length-1)slideCard(dir,()=>{state.index+=1;renderQuestion();});
  else showResult();
}
function goPrev(){
  if(state.index>0&&!state.sliding)slideCard('back',()=>{state.index-=1;renderQuestion();});
}

/* ── 開始 / 重新 ── */
const startQuiz=(fromSaved=false)=>{
  if(!fromSaved){state.index=0;state.answers=Array(questions.length).fill(null);}
  state.sliding=false;progressFill.style.width='0%';revealHint.classList.remove('show');
  setScreen(quizScreen);renderQuestion();

const computeResult=()=>{
  const fresh={Mood:0,Energy:0,Intimacy:0,Direct:0,Romance:0,Touch:0,Curious:0,Lust:0};
  state.answers.forEach((ans,i)=>{if(!ans)return;const[k,v]=scoreMap[i][ans];fresh[k]+=v;});
  state.score=fresh;
  return[fresh.Mood>=fresh.Energy?'M':'E',fresh.Intimacy>=fresh.Direct?'I':'D',fresh.Romance>=fresh.Touch?'R':'T',fresh.Curious>=fresh.Lust?'C':'L'].join('');
};

/* ── 粒子 ── */
function fireParticles(){
  particlesEl.innerHTML='';
  const colors=['#98aab8','#d7dbe2','#566573','#21395a','#b8c9d8','#e2e6ec'];
  const cx=window.innerWidth/2,cy=window.innerHeight*.36;
  for(let i=0;i<28;i++){
    const p=document.createElement('div');p.className='particle';
    const sz=2+Math.random()*8,angle=Math.random()*360,dist=80+Math.random()*220;
    const dx=Math.cos(angle*Math.PI/180)*dist+'px',dy=(Math.sin(angle*Math.PI/180)*dist-50)+'px';
    const color=colors[Math.floor(Math.random()*colors.length)];
    const dur=600+Math.random()*600,delay=Math.random()*300;
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${cx}px;top:${cy}px;background:${color};--dx:${dx};--dy:${dy};animation:particleFly ${dur}ms cubic-bezier(.2,.8,.4,1) ${delay}ms forwards;box-shadow:0 0 ${sz*1.5}px ${color}44`;
    particlesEl.appendChild(p);
  }
}

function buildScoreBars(code,score){
  scoreBars.innerHTML='';shareData.bars=[];
  DIMS.forEach((d,di)=>{
    const total=(score[d.a]||0)+(score[d.b]||0)||1;

}

/* ── Slot machine ── */
const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function runSlotMachine(code){
  resultCodeEl.innerHTML='';resultCodeEl.classList.remove('revealed');
  const chars=[...code];
  const slots=chars.map(()=>{
    const wrap=document.createElement('span');wrap.className='slot-char';
    const inner=document.createElement('div');inner.className='slot-inner';
    for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=CHARS[Math.floor(Math.random()*CHARS.length)];inner.appendChild(s);}
    const tgt=document.createElement('span');tgt.textContent='?';
    inner.appendChild(tgt);wrap.appendChild(inner);resultCodeEl.appendChild(wrap);
    return{wrap,inner,tgt};
  });
  chars.forEach((ch,ci)=>{
    const{inner,tgt,wrap}=slots[ci];
    const delay=ci*340+180,dur=540+ci*90;
    setTimeout(()=>{inner.style.transition=`transform ${dur}ms cubic-bezier(.22,.68,0,1.2)`;inner.style.transform=`translateY(-${(inner.children.length-1)*1.1}em)`;},delay);
    setTimeout(()=>{tgt.textContent=ch;inner.style.transition='none';wrap.style.animation='slotLock .34s cubic-bezier(.36,.07,.19,.97)';setTimeout(()=>wrap.style.animation='',400);},delay+dur+40);
  });
  const totalDelay=chars.length*340+180+720;
  setTimeout(()=>{
    resultCodeEl.innerHTML='';chars.forEach(ch=>{const s=document.createElement('span');s.textContent=ch;resultCodeEl.appendChild(s);});
    resultCodeEl.classList.add('revealed');resultName.classList.add('show');
    setTimeout(()=>resultName.classList.add('revealed'),120);resultTag.classList.add('show');
  },totalDelay);
}

/* ── Canvas helpers ── */
function roundRect(ctx,x,y,w,h,r){
  if(w<=0)return;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ── makeShareBlob（JPEG 0.92 + DPR=2 高畫質）── */
async function makeShareBlob(){
  await preloadCanvasFonts();
  if(!logoImg)await preloadLogo();
  const{code,name,tag,desc,pills,bars,isE,match}=shareData;
  const W=1080,H=1920,DPR=2;
  const cv=document.createElement('canvas');cv.width=W*DPR;cv.height=H*DPR;
  const ctx=cv.getContext('2d');ctx.scale(DPR,DPR);
  const FB=canvasFontsReady?`${CANVAS_FONT_BODY},Arial,sans-serif`:'Arial,sans-serif';
  const FD=canvasFontsReady?`${CANVAS_FONT_DISPLAY},Georgia,serif`:'Georgia,serif';

  /* 1. 背景 */
  const bgGrad=ctx.createLinearGradient(0,0,W,H);
  bgGrad.addColorStop(0,'#060d1a');bgGrad.addColorStop(.35,'#0a1526');
  bgGrad.addColorStop(.7,'#0f1c35');bgGrad.addColorStop(1,'#070d1c');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  function radialGlow(x,y,r,c1,c2,blend='screen'){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.save();ctx.globalCompositeOperation=blend;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  /* 2. 環境光 */
  radialGlow(W*.5,-80,820,'rgba(25,50,90,.72)','rgba(25,50,90,0)');
  radialGlow(W*.85,H*.22,520,isE?'rgba(90,110,130,.38)':'rgba(30,58,100,.42)','rgba(30,58,100,0)');
  radialGlow(-60,H*.6,600,'rgba(15,35,70,.5)','rgba(15,35,70,0)');
  radialGlow(W*.5,H*.55,700,'rgba(152,170,184,.055)','rgba(152,170,184,0)');

  /* 3. 斜線紋理 */
  ctx.save();ctx.globalAlpha=.022;ctx.strokeStyle='#c8d4e0';ctx.lineWidth=1;
  for(let x=-H;x<W+H;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H,H);ctx.stroke();}
  ctx.globalAlpha=1;ctx.restore();

  /* 4. 星星 */
  ctx.save();
  const ss=code.charCodeAt(0)*31+code.charCodeAt(1)*17;
  for(let i=0;i<70;i++){
    const sx=((ss*i*137.5+i*431)%997)/997*W;
    const sy=((ss*i*97.3+i*317)%991)/991*H;
    const sr=.3+((i*73)%10)/10*2.6,sa=.03+((i*53)%10)/10*.32;
    ctx.globalAlpha=sa;ctx.fillStyle='#d7dbe2';ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();

  /* 5. 角色圖區 */
  const CHAR_X=W*0.38,CHAR_Y=H*0.06,CHAR_W=W*0.62,CHAR_H=H*0.52;
  radialGlow(CHAR_X+CHAR_W*.5,CHAR_Y+CHAR_H*.45,CHAR_W*.72,
    isE?'rgba(80,105,130,.28)':'rgba(30,60,100,.32)','rgba(30,60,100,0)');
  if(characterImg){
    const aspect=characterImg.naturalWidth/characterImg.naturalHeight;
    const dh=CHAR_H,dw=dh*aspect;
    const dx=CHAR_X+(CHAR_W-dw)/2,dy=CHAR_Y;
    ctx.save();ctx.drawImage(characterImg,dx,dy,dw,dh);ctx.restore();
  } else {
    ctx.save();
    ctx.strokeStyle='rgba(152,170,184,.1)';ctx.lineWidth=1;ctx.setLineDash([8,8]);
    roundRect(ctx,CHAR_X+20,CHAR_Y+20,CHAR_W-40,CHAR_H-40,24);ctx.stroke();
    ctx.fillStyle='rgba(152,170,184,.03)';ctx.fill();
    ctx.font=`400 20px ${FB}`;ctx.fillStyle='rgba(152,170,184,.15)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('角色圖預留區',CHAR_X+CHAR_W/2,CHAR_Y+CHAR_H/2);
    ctx.setLineDash([]);ctx.restore();
  }

  /* 6. 頂部細線 */
  const topLine=ctx.createLinearGradient(0,0,W,0);
  topLine.addColorStop(0,'rgba(152,170,184,0)');topLine.addColorStop(.2,'rgba(152,170,184,.35)');
  topLine.addColorStop(.5,'rgba(215,219,226,.55)');topLine.addColorStop(.8,'rgba(152,170,184,.35)');
  topLine.addColorStop(1,'rgba(152,170,184,0)');
  ctx.save();ctx.strokeStyle=topLine;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,1);ctx.lineTo(W,1);ctx.stroke();ctx.restore();

  /* 7. Logo */
  if(logoImg){
    const lh=52,lw=logoImg.naturalWidth*(lh/logoImg.naturalHeight);
    ctx.save();ctx.globalAlpha=.9;ctx.filter='brightness(0) invert(1)';
    ctx.drawImage(logoImg,68,68,lw,lh);ctx.filter='none';ctx.restore();
  }
  ctx.save();ctx.font=`700 13px ${FB}`;ctx.fillStyle='rgba(152,170,184,.38)';
  ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('MBTI RESULT',W-68,94);ctx.restore();

  /* 8. 內容區 */
  const CX=68,CT=H*0.52;
  const sepLine=ctx.createLinearGradient(CX,0,CX+320,0);
  sepLine.addColorStop(0,'rgba(152,170,184,.55)');sepLine.addColorStop(1,'rgba(152,170,184,0)');
  ctx.save();ctx.strokeStyle=sepLine;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(CX,CT-28);ctx.lineTo(CX+300,CT-28);ctx.stroke();ctx.restore();
  ctx.save();ctx.font=`400 16px ${FB}`;ctx.fillStyle='rgba(152,170,184,.48)';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('YOUR TYPE',CX,CT);ctx.restore();

  /* 9. MBTI CODE 大字 */
  ctx.save();
  ctx.shadowColor=isE?'rgba(140,165,185,.35)':'rgba(50,90,150,.35)';ctx.shadowBlur=55;
  const codeGrad=ctx.createLinearGradient(CX,0,CX+580,0);
  codeGrad.addColorStop(0,'#ffffff');
  codeGrad.addColorStop(.25,'#e8edf2');
  codeGrad.addColorStop(.5,'#b8c8d8');
  codeGrad.addColorStop(.6,'#98aab8');
  codeGrad.addColorStop(1,isE?'#7a9ab0':'#4a6580');
  ctx.font=`400 178px ${FD}`;ctx.fillStyle=codeGrad;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText(code,CX-6,CT+192);
  ctx.shadowBlur=0;ctx.restore();

  /* 10. 名稱 & 標籤 */
  const NAME_Y=CT+236;
  ctx.save();ctx.font=`400 52px ${FD}`;ctx.fillStyle='#d7dbe2';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(name,CX,NAME_Y);ctx.restore();

  ctx.save();ctx.font=`400 17px ${FB}`;ctx.fillStyle='rgba(152,170,184,.55)';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(tag.toUpperCase(),CX,NAME_Y+38);ctx.restore();

  /* 11. 描述文字（自動換行）*/
  const DESC_Y=NAME_Y+86;
  ctx.save();ctx.font=`400 22px ${FB}`;ctx.fillStyle='rgba(180,192,202,.68)';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const maxTW=W-CX-68,lineH=40;let line='',ly=DESC_Y;
  for(const ch of desc){
    const test=line+ch;
    if(ctx.measureText(test).width>maxTW&&line.length){ctx.fillText(line,CX,ly);line=ch;ly+=lineH;}
    else line=test;
  }
  if(line)ctx.fillText(line,CX,ly);
  ctx.restore();

  /* 12. Pills */
  const PILL_Y=ly+56;
  ctx.save();ctx.font=`400 17px ${FB}`;
  let px=CX;
  pills.forEach(txt=>{
    const tw=ctx.measureText(txt).width+44;
    roundRect(ctx,px,PILL_Y-24,tw,38,19);
    const pillBg=ctx.createLinearGradient(px,PILL_Y-24,px,PILL_Y+14);
    pillBg.addColorStop(0,'rgba(40,65,100,.55)');pillBg.addColorStop(1,'rgba(25,45,75,.35)');
    ctx.fillStyle=pillBg;ctx.fill();
    ctx.strokeStyle='rgba(152,170,184,.22)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(200,212,222,.82)';ctx.fillText(txt,px+22,PILL_Y+6);
    px+=tw+10;
  });ctx.restore();

  /* 13. 分數條 */
  let by=PILL_Y+62;
  bars.forEach(b=>{
    ctx.save();
    ctx.font=`400 16px ${FB}`;ctx.fillStyle='rgba(152,170,184,.5)';
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(b.label,CX,by);
    const barX=CX+56,barW=W-CX-56-68;
    roundRect(ctx,barX,by-3,barW,4,2);ctx.fillStyle='rgba(152,170,184,.1)';ctx.fill();
    const bw=Math.max(0,barW*(b.pct/100));
    if(bw>0){
      roundRect(ctx,barX,by-3,bw,4,2);
      const barFill=ctx.createLinearGradient(barX,0,barX+barW,0);
      isE?(barFill.addColorStop(0,'#4a6a88'),barFill.addColorStop(1,'#b8ccd8'))
         :(barFill.addColorStop(0,'#1e3a5f'),barFill.addColorStop(1,'#7a9ab5'));
      ctx.fillStyle=barFill;ctx.fill();
      radialGlow(barX+bw,by,12,'rgba(152,170,184,.4)','rgba(152,170,184,0)');
    }
    ctx.font=`700 14px ${FB}`;ctx.fillStyle='rgba(152,170,184,.58)';
    ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(b.pct+'%',W-68,by);
    ctx.restore();by+=48;
  });

  /* 14. 最合拍 badge */
  if(match){
    const mName=results[match]?.name||match;
    const mTxt=`✦  最合拍：${match}  ${mName}`;
    ctx.save();ctx.font=`400 16px ${FB}`;
    const mW=ctx.measureText(mTxt).width+44;
    roundRect(ctx,CX,by+16,mW,36,18);
    ctx.fillStyle='rgba(30,55,90,.5)';ctx.fill();
    ctx.strokeStyle='rgba(152,170,184,.18)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(152,170,184,.62)';
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(mTxt,CX+22,by+34);
    ctx.restore();by+=68;
  }

  /* 15. 底部細線 */
  const FOOTER_Y=H-88;
  const footLine=ctx.createLinearGradient(0,0,W,0);
  footLine.addColorStop(0,'rgba(152,170,184,0)');footLine.addColorStop(.15,'rgba(152,170,184,.2)');
  footLine.addColorStop(.85,'rgba(152,170,184,.2)');footLine.addColorStop(1,'rgba(152,170,184,0)');
  ctx.save();ctx.strokeStyle=footLine;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,FOOTER_Y-20);ctx.lineTo(W,FOOTER_Y-20);ctx.stroke();ctx.restore();

  /* 16. 底部品牌文字 */
  ctx.save();ctx.font=`400 15px ${FB}`;ctx.fillStyle='rgba(86,101,115,.55)';
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('U&ME · YOUR INNER TEMPO',68,FOOTER_Y+14);
  ctx.textAlign='right';ctx.fillStyle='rgba(86,101,115,.4)';ctx.fillText('測測你是哪種類型',W-68,FOOTER_Y+14);
  ctx.restore();

  /* ✅ JPEG 0.92 輸出，DPR=2 解析度完全保留，檔案從 10MB 降至約 2MB */
  return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',0.92));
}

/* ── 下載 blob ── */
async function dlBlob(blob,fname){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
}

/* ── 分享 ── */
async function handleShare(){
  const orig=shareBtn.innerHTML,svgEl=shareBtn.querySelector('svg');
  shareBtn.classList.add('loading');if(svgEl)svgEl.style.display='none';
  try{
    const blob=await makeShareBlob();
    const fname=`ume-mbti-${shareData.code||'result'}.jpg`;
    const file=new File([blob],fname,{type:'image/jpeg',lastModified:Date.now()});
    const data={files:[file],title:'U&ME MBTI 結果',text:`我在 U&ME MBTI 測到 ${shareData.code}｜${shareData.name}｜${shareData.tag}\n\n測測你是哪種類型 👇`};
    if(navigator.canShare&&navigator.canShare(data))await navigator.share(data);
    else{await dlBlob(blob,fname);alert('已下載圖片，請手動上傳到你想分享的平台 🙌');}
  }catch(e){if(e.name!=='AbortError')console.warn(e);}
  finally{shareBtn.classList.remove('loading');if(svgEl)svgEl.style.display='';shareBtn.innerHTML=orig;}
}

/* ── 儲存 ── */
async function handleSave(){
  const orig=saveBtn.innerHTML,svgEl=saveBtn.querySelector('svg');
  saveBtn.classList.add('loading');if(svgEl)svgEl.style.display='none';
  try{
    const blob=await makeShareBlob();
    const fname=`ume-mbti-${shareData.code||'result'}.jpg`;
    await dlBlob(blob,fname);
    saveBtn.classList.remove('loading');if(svgEl)svgEl.style.display='';
    saveBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已儲存';
    setTimeout(()=>{saveBtn.innerHTML=orig;},1800);
  }catch(e){
    saveBtn.classList.remove('loading');if(svgEl)svgEl.style.display='';saveBtn.innerHTML=orig;
  }
}

/* ── 恢復進度 banner ── */
(()=>{
  const saved=loadProgress();
  if(saved&&saved.answers&&saved.answers.some(a=>a!==null)){
    const answered=saved.answers.filter(a=>a!==null).length;
    resumeInfo.textContent=`（已完成 ${answered} / ${questions.length} 題）`;
    resumeBanner.classList.add('show');
    resumeContinue.addEventListener('click',()=>{
      state.index=saved.index||0;state.answers=saved.answers;
      resumeBanner.classList.remove('show');startQuiz(true);
    });
    resumeDiscard.addEventListener('click',()=>{
      clearProgress();resumeBanner.classList.remove('show');
    });
  }
})();

/* ── 事件綁定 ── */
startBtn.addEventListener('click',()=>startQuiz(false));
nextBtn.addEventListener('click',()=>goNext('forward'));
backBtn.addEventListener('click',goPrev);
restartBtn.addEventListener('click',restartToStart);
shareBtn.addEventListener('click',handleShare);
saveBtn.addEventListener('click',handleSave);

/* ── 漣漪效果 ── */
stage.addEventListener('pointerdown',e=>{
  const r=document.createElement('span');
  r.style.cssText='position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(152,170,184,.18) 0%,transparent 68%);animation:rip .8s ease-out forwards;mix-blend-mode:screen;z-index:4';
  const rc=stage.getBoundingClientRect();
  r.style.left=(e.clientX-rc.left)+'px';r.style.top=(e.clientY-rc.top)+'px';
  stage.appendChild(r);r.addEventListener('animationend',()=>r.remove());
});
</script>
