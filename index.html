<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>U&ME MBTI</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#0c1730;--surface:#111f3a;--surface-2:#1a2d4a;
      --border:rgba(152,170,184,.18);--text:#d7dbe2;--muted:#98aab8;
      --accent:#98aab8;--accent-2:#566573;--bar-bg:rgba(152,170,184,.12);
      --font-display:'Georgia',serif;--font-body:'Inter',system-ui,sans-serif;
      --theme-glow:rgba(33,57,90,.55);--theme-grad-a:#21395a;--theme-grad-b:#98aab8;
    }
    [data-result-theme="E"]{
      --accent:#d7dbe2;--accent-2:#98aab8;
      --theme-glow:rgba(86,101,115,.42);--theme-grad-a:#566573;--theme-grad-b:#d7dbe2;
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
    button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}

    .curtain{position:fixed;inset:0;z-index:999;pointer-events:none;display:grid;place-items:center;background:var(--bg);animation:curtainFade 2.2s cubic-bezier(.16,1,.3,1) forwards}
    .curtain-logo{opacity:0;animation:curtainLogoIn 1s cubic-bezier(.16,1,.3,1) .2s forwards,curtainLogoOut .55s cubic-bezier(.4,0,1,1) 1.25s forwards}
    .curtain-logo img{filter:brightness(0) saturate(100%) invert(88%) sepia(8%) saturate(200%) hue-rotate(185deg) brightness(110%)}
    @keyframes curtainFade{0%{opacity:1}58%{opacity:1}100%{opacity:0;pointer-events:none}}
    @keyframes curtainLogoIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
    @keyframes curtainLogoOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}

    .stage{width:100vw;height:100svh;min-height:100svh;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(33,57,90,.55),transparent),radial-gradient(ellipse 60% 40% at 80% 110%,rgba(12,23,48,.8),transparent),var(--bg);}
    .stars{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .star{position:absolute;border-radius:50%;background:#d7dbe2;animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s)}
    @keyframes twinkle{0%,100%{opacity:.05}50%{opacity:var(--peak,.25)}}

    .glow-a{position:absolute;width:min(90vw,780px);height:min(90vw,780px);filter:blur(110px);opacity:.48;background:radial-gradient(circle,rgba(33,57,90,.7),rgba(12,23,48,.1) 65%);left:50%;top:40%;transform:translate(-50%,-50%);animation:pulseA 6s ease-in-out infinite;pointer-events:none;z-index:0}
    .glow-b{position:absolute;width:min(50vw,420px);height:min(50vw,420px);filter:blur(80px);opacity:.32;background:radial-gradient(circle,rgba(86,101,115,.5),transparent 65%);left:15%;top:65%;transform:translate(-50%,-50%);animation:pulseB 9s ease-in-out infinite;pointer-events:none;z-index:0}
    @keyframes pulseA{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.48}50%{transform:translate(-50%,-52%) scale(1.08);opacity:.62}}
    @keyframes pulseB{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.32}50%{transform:translate(-48%,-52%) scale(1.12);opacity:.44}}

    .topbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:flex-start;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:8;opacity:0;animation:fadeSlideDown .7s cubic-bezier(.16,1,.3,1) 2s forwards}
    @keyframes fadeSlideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    .brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
    .logo-mark{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--accent);background:rgba(33,57,90,.3);backdrop-filter:blur(8px)}

    .screen{position:absolute;inset:0;display:grid;place-items:center;padding:calc(68px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));text-align:center;transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1),filter .5s cubic-bezier(.16,1,.3,1);overflow:hidden}
    .screen[hidden]{opacity:0;pointer-events:none;transform:translateY(12px) scale(.98);filter:blur(10px)}
    .screen.active{opacity:1;transform:none;filter:none}

    .brand{display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;width:min(92vw,480px);height:min(72svh,540px);position:relative;z-index:1;}
    .brand-top{display:grid;gap:10px;justify-items:center;align-content:center;animation:staggerA 1s cubic-bezier(.16,1,.3,1) 2.1s both}
    .brand-mid{display:grid;gap:8px;justify-items:center;align-content:center;animation:staggerB 1s cubic-bezier(.16,1,.3,1) 2.28s both}
    .brand-bot{display:grid;gap:0;justify-items:center;align-content:center;animation:staggerC 1s cubic-bezier(.16,1,.3,1) 2.46s both}
    @keyframes staggerA{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes staggerB{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes staggerC{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

    .logo-wrap{position:relative;display:grid;place-items:center}
    .logo-aura{position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(33,57,90,.45),transparent 68%);animation:auraPulse 3.5s ease-in-out infinite;pointer-events:none;filter:blur(18px)}
    @keyframes auraPulse{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.12);opacity:.85}}
    .logo-image{width:min(48vw,210px);position:relative;z-index:1;animation:logoFloat 5s ease-in-out infinite}
    .logo-image img{width:100%;height:auto;display:block;filter:brightness(0) saturate(100%) invert(88%) sepia(8%) saturate(200%) hue-rotate(185deg) brightness(110%) drop-shadow(0 2px 20px rgba(152,170,184,.4));}
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    .brand-divider{width:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(152,170,184,.45),transparent)}
    .brand-tagline{font-size:clamp(12px,3vw,14px);color:var(--muted);letter-spacing:.08em;line-height:1.65}
    .count-badge{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:5px 13px;border-radius:999px;background:rgba(33,57,90,.32);letter-spacing:.06em;backdrop-filter:blur(10px)}

    .start-wrap{display:grid;gap:10px;justify-items:center;margin-top:8px}
    .start{width:70px;height:70px;border-radius:50%;border:1px solid rgba(152,170,184,.28);background:linear-gradient(145deg,#21395a,#566573);color:#d7dbe2;display:grid;place-items:center;box-shadow:0 8px 28px rgba(12,23,48,.5),0 0 0 6px rgba(33,57,90,.18),inset 0 1px 0 rgba(215,219,226,.12);transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s ease;}
    .start:hover{transform:scale(1.08);box-shadow:0 14px 38px rgba(12,23,48,.6),0 0 0 10px rgba(33,57,90,.22),inset 0 1px 0 rgba(215,219,226,.14)}
    .start:active{transform:scale(.95)}
    .start-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

    .quiz{width:min(100%,760px);display:grid;gap:11px;justify-items:stretch;text-align:left;position:relative;z-index:2}
    .quiz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
    .quiz-kicker{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
    .quiz-title{margin:0;font-family:var(--font-display);font-size:clamp(22px,5.5vw,40px);line-height:1.1;letter-spacing:-.01em;color:var(--text)}
    .quiz-progress{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-bottom:2px;font-variant-numeric:tabular-nums}
    .progress-bar{height:5px;border-radius:999px;background:var(--bar-bg);overflow:hidden;position:relative}
    .progress-bar>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#21395a,#98aab8,#d7dbe2);background-size:200% 100%;transition:width .45s cubic-bezier(.16,1,.3,1);animation:shimmer 3s linear infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .progress-bar.complete>span{animation:shimmer 3s linear infinite,barFlash .5s ease forwards}
    @keyframes barFlash{0%{filter:brightness(1)}40%{filter:brightness(1.6)}100%{filter:brightness(1)}}

    .reveal-hint{text-align:center;font-size:11.5px;letter-spacing:.14em;color:var(--accent);opacity:0;transform:translateY(5px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
    .reveal-hint.show{opacity:1;transform:none}
    .reveal-hint::before{content:'✦ ';font-size:9px}

    .card{border:1px solid var(--border);background:color-mix(in oklab,#111f3a 92%,rgba(33,57,90,.5));border-radius:22px;padding:16px;box-shadow:0 20px 52px rgba(12,23,48,.45),inset 0 1px 0 rgba(215,219,226,.1),inset 0 -1px 0 rgba(12,23,48,.3);backdrop-filter:blur(14px);will-change:transform,opacity;}
    .card.exit-left{animation:exitLeft .2s cubic-bezier(.4,0,1,1) both}
    .card.enter-right{animation:enterRight .28s cubic-bezier(0,0,.2,1) both}
    .card.exit-right{animation:exitRight .2s cubic-bezier(.4,0,1,1) both}
    .card.enter-left{animation:enterLeft .28s cubic-bezier(0,0,.2,1) both}
    @keyframes exitLeft{to{transform:translateX(-40px);opacity:0;filter:blur(3px)}}
    @keyframes enterRight{from{transform:translateX(40px);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
    @keyframes exitRight{to{transform:translateX(40px);opacity:0;filter:blur(3px)}}
    @keyframes enterLeft{from{transform:translateX(-40px);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}

    .question{margin:0 0 13px;font-size:clamp(16px,4.5vw,24px);line-height:1.38;font-weight:700;letter-spacing:-.01em;color:var(--text)}
    .options{display:grid;gap:8px}
    .option{width:100%;min-height:50px;text-align:left;padding:13px 38px 13px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(33,57,90,.2);color:var(--text);line-height:1.45;font-size:14px;white-space:pre-line;position:relative;overflow:hidden;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .14s ease;}
    .option::after{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:999px;background:var(--accent);opacity:0;transform:scaleY(.4);transition:opacity .2s ease,transform .2s ease;}
    .option:hover{border-color:rgba(152,170,184,.3);background:rgba(33,57,90,.38);box-shadow:0 6px 18px rgba(12,23,48,.3)}
    .option:active{transform:scale(.984)}
    .option.selected{border-color:rgba(152,170,184,.48);background:rgba(33,57,90,.55);box-shadow:inset 0 0 0 1px rgba(152,170,184,.14),0 8px 20px rgba(12,23,48,.35)}
    .option.selected::after{opacity:1;transform:scaleY(1)}
    .option.selected .opt-check{opacity:1;transform:translateY(-50%) scale(1)}
    .opt-check{position:absolute;right:13px;top:50%;transform:translateY(-50%) scale(.5);width:20px;height:20px;border-radius:50%;background:rgba(152,170,184,.18);border:1px solid rgba(152,170,184,.32);display:grid;place-items:center;font-size:11px;color:var(--accent);font-weight:700;opacity:0;transition:opacity .22s ease,transform .22s cubic-bezier(.16,1,.3,1);}
    .option.tap-bounce{animation:tapBounce .22s cubic-bezier(.36,.07,.19,.97) both}
    @keyframes tapBounce{0%{transform:scale(1)}40%{transform:scale(.972)}100%{transform:scale(1)}}

    .nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .ghost,.next,.share-btn,.restart-btn{min-height:46px;padding:11px 18px;border-radius:999px;transition:transform .18s ease,opacity .18s ease,box-shadow .18s ease;font:inherit}
    .ghost{border:1px solid var(--border);background:rgba(33,57,90,.22);color:var(--text);backdrop-filter:blur(8px)}
    .ghost:hover{transform:translateY(-1px);background:rgba(33,57,90,.36)}
    .next,.restart-btn{border:1px solid rgba(152,170,184,.18);background:linear-gradient(135deg,#21395a,#566573);color:#d7dbe2;min-width:110px;box-shadow:0 4px 18px rgba(12,23,48,.4),inset 0 1px 0 rgba(215,219,226,.1)}
    .next:hover,.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(12,23,48,.5)}
    .next:active,.restart-btn:active{transform:scale(.97)}
    .next:disabled,.ghost:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
    .footer-note{font-size:11px;color:var(--muted);text-align:center;opacity:.7}

    .result-code{font-family:var(--font-display);font-size:clamp(36px,11vw,76px);line-height:1;margin-bottom:2px;letter-spacing:.1em;display:flex;gap:.05em;color:#d7dbe2;}
    .result-code.revealed{background:linear-gradient(135deg,#d7dbe2 0%,#98aab8 45%,#566573 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .result-code.revealed span{display:inline;}
    .slot-char{display:inline-block;position:relative;overflow:hidden;height:1.1em;width:.72em;vertical-align:top}
    .slot-inner{display:flex;flex-direction:column;transition:none}
    .slot-inner span{display:block;height:1.1em;line-height:1.1;text-align:center}

    .result-name{font-size:clamp(22px,5.5vw,36px);font-weight:700;margin-bottom:1px;font-family:var(--font-display);line-height:1.05;letter-spacing:-.01em;color:#d7dbe2;opacity:0;transform:translateY(9px);transition:opacity .55s ease,transform .55s ease;}
    .result-name.show{opacity:1;transform:none}
    .result-name.revealed{background:linear-gradient(120deg,#d7dbe2 0%,#98aab8 60%,#566573 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    .result-tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .4s ease .12s}
    .result-tag.show{opacity:1}

    .result-screen-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 20%,var(--theme-glow),transparent 55%),radial-gradient(ellipse 50% 40% at 10% 80%,rgba(33,57,90,.28),transparent 50%);pointer-events:none;animation:drift 20s ease-in-out infinite}
    .cinema-wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,23,48,.08),transparent 15%,transparent 85%,rgba(12,23,48,.1));pointer-events:none;z-index:0}
    .reveal-burst{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(33,57,90,.65),transparent 55%);opacity:0;pointer-events:none;z-index:1}
    .reveal-burst.fire{animation:burst .95s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes burst{0%{opacity:.9;transform:scale(.65)}65%{opacity:.4}100%{opacity:0;transform:scale(1.5)}}
    .particles{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
    .particle{position:absolute;border-radius:50%;opacity:0}
    @keyframes particleFly{0%{opacity:.9;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

    .result-layout{width:min(100%,940px);height:100%;display:grid;align-items:center;position:relative;z-index:3}
    .result-card{
      max-width:100%;
      height:min(100%,calc(100svh - 108px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
      display:grid;grid-template-rows:auto auto auto auto;gap:9px;
      text-align:left;border-radius:28px;padding:18px;
      background:linear-gradient(160deg,#111f3a,#0f1b34);
      position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
      border:1px solid rgba(152,170,184,.15);
      box-shadow:0 28px 72px rgba(12,23,48,.65),inset 0 1px 0 rgba(215,219,226,.08);
      animation:resultRise 950ms cubic-bezier(.16,1,.3,1) both;
    }
    .result-card::-webkit-scrollbar{display:none}
    .result-card{scrollbar-width:none;-ms-overflow-style:none}
    .result-card::after{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(152,170,184,.38),rgba(215,219,226,.22),rgba(152,170,184,.38),transparent);border-radius:999px;pointer-events:none;z-index:2}
    .result-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at top left,rgba(33,57,90,.32),transparent 40%),radial-gradient(circle at bottom right,rgba(86,101,115,.18),transparent 42%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(215,219,226,.022) 22px 23px);pointer-events:none;z-index:0}
    .result-hero,.result-section,.share-row,.result-cta{position:relative;z-index:1}
    .result-hero{display:grid;gap:5px}
    .result-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
    .result-badge,.pill{padding:5px 10px;border-radius:999px;border:1px solid rgba(152,170,184,.18);background:rgba(33,57,90,.38);font-size:11px;letter-spacing:.06em;color:var(--muted)}
    .result-section{display:grid;gap:5px;padding-top:9px;border-top:1px solid rgba(152,170,184,.09)}
    .result-section h2{margin:0;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;opacity:.8}
    .result-section p,.result-desc{margin:0;color:var(--muted);line-height:1.58;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .result-pill-row{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0}

    .score-bars{display:grid;gap:5px;margin:4px 0 0}
    .score-bar-row{display:grid;grid-template-columns:48px 1fr 30px;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
    .score-bar-track{height:3px;border-radius:999px;background:var(--bar-bg);overflow:hidden}
    .score-bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--theme-grad-a),var(--theme-grad-b));width:0;transition:width .9s cubic-bezier(.16,1,.3,1)}
    .score-pct{font-size:10.5px;color:var(--accent);font-weight:700;text-align:right}

    .share-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
    .share-btn{border:1px solid var(--border);background:rgba(33,57,90,.28);color:var(--text);min-height:46px;padding:11px 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(10px);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
    .share-btn.primary{background:linear-gradient(135deg,#21395a,#566573);border-color:rgba(152,170,184,.18);color:#d7dbe2;box-shadow:0 6px 22px rgba(12,23,48,.45),inset 0 1px 0 rgba(215,219,226,.1)}
    .share-btn:hover{transform:translateY(-2px)}
    .share-btn.primary:hover{box-shadow:0 10px 28px rgba(12,23,48,.55)}
    .share-btn:active{transform:scale(.96)}
    .platform-icons{grid-column:1/-1;display:flex;justify-content:center;gap:12px;padding:3px 0 0}
    .platform-icons span{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:rgba(33,57,90,.35);display:grid;place-items:center;font-size:13px}
    .share-hint{grid-column:1/-1;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.5;padding:2px 0 0;opacity:.8}
    .result-cta{padding-bottom:2px}
    .restart-btn{width:100%;min-height:44px;font-size:14px}
    .share-btn.loading{opacity:.65;pointer-events:none}
    .share-btn.loading::after{content:'';display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-left:5px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .scroll-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:0;animation:scrollHintIn .6s ease 1.8s forwards,scrollHintOut .4s ease 3.8s forwards;pointer-events:none;z-index:10}
    .scroll-hint svg{animation:bounceDown 1.2s ease-in-out infinite}
    @keyframes scrollHintIn{to{opacity:.6}}
    @keyframes scrollHintOut{to{opacity:0}}
    @keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

    .copyright{position:fixed;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(152,170,184,.4);letter-spacing:.1em;white-space:nowrap;pointer-events:none;z-index:999;font-family:var(--font-body)}

    @keyframes drift{50%{transform:translateY(-8px) scale(1.015)}}
    @keyframes resultRise{from{opacity:0;transform:translateY(20px) scale(.982)}to{opacity:1;transform:none}}
    @keyframes rip{from{width:0;height:0;opacity:.5}to{width:400px;height:400px;opacity:0}}
    @keyframes slotLock{0%{transform:translateY(0)}30%{transform:translateY(-5px)}65%{transform:translateY(2px)}100%{transform:translateY(0)}}

    @media(max-width:767px){
      .nav{flex-direction:column}.ghost,.next{width:100%}
      .screen{padding:calc(64px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
      .quiz{gap:9px}

const setScreen=s=>{
  [introScreen,quizScreen,resultScreen].forEach(el=>{el.hidden=el!==s;el.classList.remove('active')});
  s.hidden=false;requestAnimationFrame(()=>s.classList.add('active'));
};

const updateProgress=()=>{
  const pct=Math.max(0,Math.min(100,(state.index/(questions.length-1))*100));
  progressFill.style.width=`${pct}%`;
  if(pct>=100){progressBar.classList.add('complete');setTimeout(()=>progressBar.classList.remove('complete'),700);}
};

function slideCard(dir,cb){
  if(state.sliding)return;state.sliding=true;
  const ec=dir==='forward'?'exit-left':'exit-right',nc=dir==='forward'?'enter-right':'enter-left';
  quizCard.classList.add(ec);
  quizCard.addEventListener('animationend',function onE(){
    quizCard.removeEventListener('animationend',onE);quizCard.classList.remove(ec);cb();
    void quizCard.offsetWidth;quizCard.classList.add(nc);
    quizCard.addEventListener('animationend',function onN(){
      quizCard.removeEventListener('animationend',onN);quizCard.classList.remove(nc);state.sliding=false;
    });
  });
}

const renderQuestion=()=>{
  const i=state.index;
  quizTitle.textContent=`第 ${i+1} 題`;
  quizProgress.textContent=`${i+1} / ${questions.length}`;

  const isLast=i===questions.length-1;

      b.classList.add('tap-bounce');
      b.addEventListener('animationend',()=>b.classList.remove('tap-bounce'),{once:true});
      optionsEl.style.pointerEvents='none';
      setTimeout(()=>optionsEl.style.pointerEvents='',320);
      state.answers[i]=key;renderQuestion();
      if(i<questions.length-1)setTimeout(()=>goNext('forward'),300);
      else{nextBtn.disabled=false;nextBtn.textContent='完成';revealHint.classList.add('show');}
    });
    optionsEl.appendChild(b);
  });
  backBtn.disabled=i===0;
  nextBtn.textContent=isLast?'完成':'下一題';
  nextBtn.disabled=state.answers[i]==null;
};

function goNext(dir='forward'){
  if(state.answers[state.index]==null||state.sliding)return;
  if(state.index<questions.length-1)slideCard(dir,()=>{state.index+=1;renderQuestion();});
  else showResult();
}
function goPrev(){
  if(state.index>0&&!state.sliding)slideCard('back',()=>{state.index-=1;renderQuestion();});
}
const startQuiz=()=>{
  state.index=0;state.sliding=false;
  state.answers=Array(questions.length).fill(null);
  progressFill.style.width='0%';revealHint.classList.remove('show');
  setScreen(quizScreen);renderQuestion();
};

const computeResult=()=>{
  state.score={Mood:0,Energy:0,Intimacy:0,Direct:0,Romance:0,Touch:0,Curious:0,Lust:0};
  state.answers.forEach((ans,i)=>{if(!ans)return;const[k,v]=scoreMap[i][ans];state.score[k]+=v;});
  return[
    state.score.Mood>=state.score.Energy?'M':'E',
    state.score.Intimacy>=state.score.Direct?'I':'D',
    state.score.Romance>=state.score.Touch?'R':'T',
    state.score.Curious>=state.score.Lust?'C':'L'
  ].join('');
};

function fireParticles(){
  particlesEl.innerHTML='';
  const colors=['#98aab8','#d7dbe2','#566573','#21395a','#b8c9d8','#e2e6ec'];
  const cx=window.innerWidth/2,cy=window.innerHeight*.36;
  for(let i=0;i<20;i++){
    const p=document.createElement('div');p.className='particle';
    const sz=2.5+Math.random()*7,angle=Math.random()*360,dist=70+Math.random()*200;
    const dx=Math.cos(angle*Math.PI/180)*dist+'px',dy=(Math.sin(angle*Math.PI/180)*dist-40)+'px';
    const color=colors[Math.floor(Math.random()*colors.length)];
    const dur=550+Math.random()*550,delay=Math.random()*250;
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${cx}px;top:${cy}px;background:${color};--dx:${dx};--dy:${dy};animation:particleFly ${dur}ms cubic-bezier(.2,.8,.4,1) ${delay}ms forwards;box-shadow:0 0 ${sz*2}px ${color};`;
    particlesEl.appendChild(p);
  }
}

const DIMS=[
  {label:'節奏',a:'Mood',b:'Energy',aChar:'M'},
  {label:'靠近',a:'Intimacy',b:'Direct',aChar:'I'},
  {label:'關係',a:'Romance',b:'Touch',aChar:'R'},
  {label:'慾望',a:'Curious',b:'Lust',aChar:'C'},
];

function buildScoreBars(code,score){
  scoreBars.innerHTML='';
  DIMS.forEach((d,di)=>{
    const total=(score[d.a]||0)+(score[d.b]||0)||1;
    const chosen=code[di]===d.aChar?d.a:d.b;
    const pct=Math.round((score[chosen]||0)/total*100);
    const row=document.createElement('div');row.className='score-bar-row';
    row.innerHTML=`<span>${d.label}</span><div class="score-bar-track"><div class="score-bar-fill" data-pct="${pct}"></div></div><span class="score-pct">${pct}%</span>`;
    scoreBars.appendChild(row);
  });
  setTimeout(()=>scoreBars.querySelectorAll('.score-bar-fill').forEach(el=>el.style.width=el.dataset.pct+'%'),650);
}

const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function runSlotMachine(code){
  resultCodeEl.innerHTML='';
  resultCodeEl.classList.remove('revealed');
  const chars=[...code];
  const slots=chars.map(()=>{
    const wrap=document.createElement('span');wrap.className='slot-char';
    const inner=document.createElement('div');inner.className='slot-inner';
    for(let i=0;i<20;i++){
      const s=document.createElement('span');
      s.textContent=CHARS[Math.floor(Math.random()*CHARS.length)];
      inner.appendChild(s);
    }
    const tgt=document.createElement('span');tgt.textContent='?';
    inner.appendChild(tgt);wrap.appendChild(inner);resultCodeEl.appendChild(wrap);
    return{wrap,inner,tgt};
  });
  chars.forEach((ch,ci)=>{
    const{inner,tgt,wrap}=slots[ci];
    const delay=ci*340+180,dur=540+ci*90;
    setTimeout(()=>{
      inner.style.transition=`transform ${dur}ms cubic-bezier(.22,.68,0,1.2)`;
      inner.style.transform=`translateY(-${(inner.children.length-1)*1.1}em)`;
    },delay);
    setTimeout(()=>{
      tgt.textContent=ch;
      inner.style.transition='none';
      wrap.style.animation='slotLock .34s cubic-bezier(.36,.07,.19,.97)';
      setTimeout(()=>wrap.style.animation='',400);
    },delay+dur+40);
  });
  const totalDelay=chars.length*340+180+720;
  setTimeout(()=>{
    // ✅ 清空重建純 span，漸層正確作用
    resultCodeEl.innerHTML='';
    chars.forEach(ch=>{
      const s=document.createElement('span');s.textContent=ch;
      resultCodeEl.appendChild(s);
    });
    resultCodeEl.classList.add('revealed');
    resultName.classList.add('show');
    setTimeout(()=>resultName.classList.add('revealed'),100);
    resultTag.classList.add('show');
  },totalDelay);
}

const showResult=()=>{
  const code=computeResult(),r=results[code]||results.MIRC,isE=code.startsWith('E');
  root.setAttribute('data-result-theme',isE?'E':'M');
  revealBurst.classList.remove('fire');void revealBurst.offsetWidth;revealBurst.classList.add('fire');
  setTimeout(()=>fireParticles(),180);
  resultName.textContent=r.name;
  resultName.classList.remove('show','revealed');
  resultTag.textContent=r.tag;resultTag.classList.remove('show');
  resultDesc.textContent=r.desc;
  resultCategory.textContent=code.startsWith('M')
    ?'妳屬於先感受、再進入的類型。妳需要氛圍、信任與細節慢慢堆疊，才會真正打開。'
    :'妳屬於先被帶動、再投入的類型。妳喜歡明確節奏、立即回饋與更直接的互動。';
  resultMood.textContent=code[2]==='R'?'情感導向':'感官導向';
  resultPace.textContent=code.startsWith('M')?'節奏：氛圍':'節奏：直接';
  resultDrive.textContent=code[3]==='C'?'步調：探索':'步調：熱烈';
  resultPills.innerHTML='';
  r.pills.forEach(t=>{const s=document.createElement('span');s.className='pill';s.textContent=t;resultPills.appendChild(s);});
  buildScoreBars(code,state.score);
  setScreen(resultScreen);
  setTimeout(()=>runSlotMachine(code),500);
};

const restartToStart=()=>{
  root.removeAttribute('data-result-theme');
  state.index=0;state.sliding=false;
  state.answers=Array(questions.length).fill(null);
  progressFill.style.width='0%';nextBtn.disabled=true;revealHint.classList.remove('show');
  setScreen(introScreen);
};

// ✅ 截圖來源：結果卡片本身
async function makeShareBlob(){
  const card=document.getElementById('resultCard');
  // 暫時展開卡片以截到完整內容
  const origOverflow=card.style.overflowY;
  const origHeight=card.style.height;
  card.style.overflowY='visible';
  card.style.height='auto';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const c=await html2canvas(card,{
    backgroundColor:'#0f1b34',
    scale:2,
    useCORS:true,
    allowTaint:true,
    scrollX:0,
    scrollY:0,
    width:card.offsetWidth,
    height:card.scrollHeight
  });
  // 還原樣式
  card.style.overflowY=origOverflow;
  card.style.height=origHeight;
  return new Promise(r=>c.toBlob(b=>r(b),'image/png',1));
}

async function dlBlob(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
}

async function handleShare(){
  const code=resultCodeEl.textContent.replace(/\s/g,'').slice(0,4)||'MBTI';
  const svgEl=shareBtn.querySelector('svg');
  shareBtn.classList.add('loading');if(svgEl)svgEl.style.display='none';
  try{
    const blob=await makeShareBlob();
    const file=new File([blob],`ume-mbti-${code}.png`,{type:'image/png',lastModified:Date.now()});
    const data={
      files:[file],
      title:'U&ME MBTI 結果',
      text:`我在 U&ME MBTI 測到 ${code}｜${resultName.textContent}｜${resultTag.textContent}\n\n測測你是哪種類型 👇`
    };
    if(navigator.canShare&&navigator.canShare(data))await navigator.share(data);
    else{await dlBlob(blob,`ume-mbti-${code}.png`);alert('已下載圖片，請手動上傳到你想分享的平台 🙌');}
  }catch(e){if(e.name!=='AbortError')console.warn(e);}
  finally{shareBtn.classList.remove('loading');if(svgEl)svgEl.style.display='';}
}

async function handleSave(){
  const code=resultCodeEl.textContent.replace(/\s/g,'').slice(0,4)||'MBTI';
  const orig=saveBtn.innerHTML;
  const svgEl=saveBtn.querySelector('svg');
  saveBtn.classList.add('loading');if(svgEl)svgEl.style.display='none';
  try{
    const blob=await makeShareBlob();
    await dlBlob(blob,`ume-mbti-${code}.png`);
    saveBtn.classList.remove('loading');if(svgEl)svgEl.style.display='';
    saveBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已儲存';
    setTimeout(()=>saveBtn.innerHTML=orig,1800);
  }catch(e){saveBtn.classList.remove('loading');saveBtn.innerHTML=orig;}
}

startBtn.addEventListener('click',startQuiz);
nextBtn.addEventListener('click',()=>goNext('forward'));
backBtn.addEventListener('click',goPrev);
restartBtn.addEventListener('click',restartToStart);
shareBtn.addEventListener('click',handleShare);
saveBtn.addEventListener('click',handleSave);

stage.addEventListener('pointerdown',e=>{
  const r=document.createElement('span');
  r.style.cssText='position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(152,170,184,.18) 0%,rgba(152,170,184,.06) 28%,transparent 68%);animation:rip .8s ease-out forwards;mix-blend-mode:screen;z-index:4';
  const rc=stage.getBoundingClientRect();
  r.style.left=(e.clientX-rc.left)+'px';r.style.top=(e.clientY-rc.top)+'px';
  stage.appendChild(r);r.addEventListener('animationend',()=>r.remove());
});
</script>
